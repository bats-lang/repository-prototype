name: review-gate-relay

# A formal pull request review (submitted, edited, dismissed) must re-run
# review-gate.yml, but pull_request_review runs a workflow as the pull
# request's head has it, which the pull request could rewrite. So this
# workflow does nothing, with no permissions, and its completion runs the
# gate through workflow_run, as the default branch has it. It is only a
# fast path: a pull request can change or delete its own copy, and a fork's
# runs can wait for approval, so nothing depends on it; the gate's schedule
# runs over every open pull request (about every 15 minutes, best effort).

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - name: Hand the review to review-gate
        run: "true"
