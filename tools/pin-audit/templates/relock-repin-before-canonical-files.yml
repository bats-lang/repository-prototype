# Daily: relock this package and move its CI pins to their newest, as a
# pull request that runs check.yml (bats-lang/repository-prototype#269).
# The work is the shared relock-pins.yml, called by commit.
name: relock

on:
  schedule:
    - cron: '@@MINUTE@@ 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  relock:
    uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@@@COMMIT@@ # @@COMMENT@@
    secrets: inherit
    with:
      npm-ignore: |
        example
      workflow-pins: |
        bats-lang/repository-prototype/.github/workflows/publish.yml
        bats-lang/repository-prototype/.github/workflows/relock-pins.yml
        bats-lang/repository-prototype/.github/workflows/text-lint-check.yml
      pin-copies: |
        bats-lang/repository-prototype/.github/workflows/text-lint-check.yml tools-ref
      repin-command: |
        sh tools/android-sdk-pins/relock.sh tools/android-sdk-pins
      repin-paths: |
        tools/android-sdk-pins
