# The scratch caller that .github/workflows/relock-pins-test.yml relocks (#395):
# never run, never copied to .github/workflows. Three pin lines in the three
# states a caller has: an older comment, the right form for an older commit,
# and no comment.
name: scratch
on:
  workflow_dispatch:
jobs:
  older-comment:
    uses: bats-lang/repository-prototype/.github/workflows/publish.yml@678ecb32ccab6a10bff3061dc7a6c6468d2b323d # v1
  right-form-older-commit:
    uses: bats-lang/repository-prototype/.github/workflows/publish.yml@678ecb32ccab6a10bff3061dc7a6c6468d2b323d # repository-prototype main 678ecb3
  no-comment:
    runs-on: ubuntu-24.04
    steps:
      - uses: bats-lang/bats/.github/actions/setup@67ebbf0c4744edce26584eef60ea26438945bab7
