# A fixture with a real outdated pin (repository-prototype#414): the relock
# fetches the releases of actions/checkout from GitHub and moves it within
# its major version, whatever the newest release is.
name: scratch fetch
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4.0.0
