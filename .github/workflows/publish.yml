# Publishes the calling package to this repository. Package repositories
# call it on every push to main:
#
#   name: publish
#   on:
#     push:
#       branches: [main]
#       paths: ['src/**', 'bats.toml']
#   jobs:
#     publish:
#       uses: bats-lang/repository-prototype/.github/workflows/publish.yml@<commit>
#       secrets: inherit
#
# (called by commit, which the package's daily relock moves, #269). It
# uploads the package with the compiler the package pins in
# .github/bats-version, set up by bats's setup action (pinned by commit,
# #334), pushes the archive to a publish/<archive> branch here, opens a
# pull request, waits for verify, and merges only when verify passes. See
# PUBLISHING-SETUP.md for the REPO_PUBLISH_TOKEN secret it uses (without a
# usable one the run is red, with an ::error:: naming the cause).
name: publish

on:
  workflow_call:
    secrets:
      REPO_PUBLISH_TOKEN:
        required: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      # Keyword: publish-token-fail (#592, after #585). A token that is
      # unset, expired, revoked or read-only (the push was rejected with
      # "Authentication failed" in eight packages) ends the job red with an
      # ::error:: naming the cause, and so does any other failure of the
      # probe (a 502 included): no case is a green skip, the later steps
      # simply do not run. The secret stays `required: false` so that an
      # unset one reaches this step and is named, not refused by GitHub at
      # the call without our message. Shell because bats has no HTTP client
      # (gh is the third-party tool).
      - name: Check that the publish token can push
        env:
          GH_TOKEN: ${{ secrets.REPO_PUBLISH_TOKEN }}
        run: |
          set -u
          R=bats-lang/repository-prototype
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the secret REPO_PUBLISH_TOKEN is not set (PUBLISHING-SETUP.md): the package is not published"
            exit 1
          fi
          rc=0
          out=$(gh api "repos/$R" --jq '.permissions.push' 2>&1) || rc=$?
          if [ "$rc" -eq 0 ] && [ "$out" = "true" ]; then
            echo "REPO_PUBLISH_TOKEN can push to $R"
          elif [ "$rc" -eq 0 ]; then
            echo "::error::REPO_PUBLISH_TOKEN cannot push to $R (read-only: its push permission is $out, not true)"
            exit 1
          elif printf '%s' "$out" | grep -q 'HTTP 401'; then
            echo "::error::REPO_PUBLISH_TOKEN is rejected by GitHub (HTTP 401: expired or revoked)"
            exit 1
          else
            echo "$out"
            echo "::error::the check of REPO_PUBLISH_TOKEN failed (not a 401, for example a 502): $out"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # checkout leaves a detached HEAD, which bats upload versions as dev1
      # (as the Rust bats does); put it back on the pushed branch.
      - name: Check out the pushed branch
        run: git checkout -B "$GITHUB_REF_NAME"

      # The compiler the package pins (.github/bats-version) is built from
      # its bootstrap C, and ATS2 is installed by bats (SHA-256 checked),
      # as every bats job does (bats-lang/bats .github/actions/setup, by
      # commit). require-lock is off because a package with no dependencies
      # has no bats.lock (arith); the lock is checked by its own CI.
      - name: Set up bats
        uses: bats-lang/bats/.github/actions/setup@8e978dfe7fac83726730361329c91b0e829beaad # bats main, PR #287 (bats has no version tags)
        with:
          require-lock: 'false'

      - name: Upload, open the pull request, merge when verify passes
        env:
          GH_TOKEN: ${{ secrets.REPO_PUBLISH_TOKEN }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -eu
          R=bats-lang/repository-prototype
          # the setup action cloned ~/repository at this repository's pinned
          # commit; a publish uploads to the newest main, with a token that can push
          clone="$RUNNER_TEMP/publish-repository"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/$R.git" "$clone"
          bats upload --repository "$clone"
          cd "$clone"
          # A version already published is never replaced: an upload of it
          # only shows up as modified files, which verify would reject.
          new=$(git status --porcelain --untracked-files=all | awk '$1 == "??" && $2 ~ /\.bats$/ { print $2 }')
          if [ -z "$new" ]; then echo "already published"; exit 0; fi
          git checkout -- .
          name=$(basename "$new" .bats)
          branch="publish/$name"
          git checkout -b "$branch"
          git add "$new" "$new.sha256"
          git -c user.name="bats-lang publish" -c user.email="publish@users.noreply.github.com" \
            commit -m "Publish $name" -m "From $SOURCE"
          git push origin "$branch"
          gh pr create --repo "$R" --head "$branch" --base main \
            --title "Publish $name" --body "Published by CI from $SOURCE."
          # main requires verify, so auto-merge merges the pull request only
          # once verify passes. Wait for verify too, so that this run fails
          # when verify does and the open pull request gets looked at.
          gh pr merge "$branch" --repo "$R" --merge --auto
          for i in $(seq 1 30); do
            [ -n "$(gh pr checks "$branch" --repo "$R" 2>/dev/null || true)" ] && break
            sleep 10
          done
          gh pr checks "$branch" --repo "$R" --watch --fail-fast
