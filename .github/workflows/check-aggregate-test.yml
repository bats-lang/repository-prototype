# Tests the check-aggregate action (#328) through a caller that has the
# shape of a `check` job: jobs that pass and one that is skipped, then the
# aggregator over them. The aggregator that must pass is green. The two that
# must fail run as a step with continue-on-error, and a step after it checks
# that its outcome was failure: needs.<job>.result is `success` for a job
# whose continue-on-error step failed (found by this test), so that is
# what the step outcome is for.
#
# The action is the one in the checked-out head (a local path), so a change
# to the action is tested by the same run: a test that named the action by
# commit tested an older action than the one the pull request changes (found
# when `jobs: ' '` passed). A caller of another repository names it by
# commit, as the action's header shows.
name: check-aggregate test

on:
  pull_request:
    paths:
      - '.github/actions/check-aggregate/**'
      - '.github/workflows/check-aggregate-test.yml'
  workflow_dispatch:

permissions: {}

jobs:
  pass-a:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "a passed"

  pass-b:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "b passed"

  # Skipped by its condition, as a matrix group with nothing in it would be
  skip-c:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "never"

  # Every job passed: green
  aggregate-pass:
    if: always()
    needs: [pass-a, pass-b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/check-aggregate
        with:
          jobs: pass-a pass-b
          results: ${{ toJSON(needs) }}

  # A needed job skipped: the aggregator must fail
  aggregate-skipped:
    if: always()
    needs: [pass-a, skip-c]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: aggregate
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: pass-a skip-c
          results: ${{ toJSON(needs) }}
      - name: The aggregator failed
        env:
          OUTCOME: ${{ steps.aggregate.outcome }}
        run: test "$OUTCOME" = failure

  # A job named but not needed: the aggregator must fail
  aggregate-missing:
    if: always()
    needs: [pass-a]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: aggregate
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: pass-a pass-b
          results: ${{ toJSON(needs) }}
      - name: The aggregator failed
        env:
          OUTCOME: ${{ steps.aggregate.outcome }}
        run: test "$OUTCOME" = failure

  # Each result the platform gives a needed job, played with the results
  # written out: a cancelled job cannot be had from a run that must itself
  # finish, so the action is given what `toJSON(needs)` would hold. Then the
  # malformed inputs. A step that is expected to fail has continue-on-error,
  # and the step after it reads its outcome.
  aggregate-results:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: result-success
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: a b
          results: '{"a":{"result":"success"},"b":{"result":"success"}}'
      - name: result-success ended success
        env:
          OUTCOME: ${{ steps.result-success.outcome }}
        run: test "$OUTCOME" = success
      - id: result-failure
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: a b
          results: '{"a":{"result":"success"},"b":{"result":"failure"}}'
      - name: result-failure ended failure
        env:
          OUTCOME: ${{ steps.result-failure.outcome }}
        run: test "$OUTCOME" = failure
      - id: result-skipped
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: a b
          results: '{"a":{"result":"success"},"b":{"result":"skipped"}}'
      - name: result-skipped ended failure
        env:
          OUTCOME: ${{ steps.result-skipped.outcome }}
        run: test "$OUTCOME" = failure
      - id: result-cancelled
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: a b
          results: '{"a":{"result":"success"},"b":{"result":"cancelled"}}'
      - name: result-cancelled ended failure
        env:
          OUTCOME: ${{ steps.result-cancelled.outcome }}
        run: test "$OUTCOME" = failure
      - id: result-absent
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: a b
          results: '{"a":{"result":"success"}}'
      - name: result-absent ended failure
        env:
          OUTCOME: ${{ steps.result-absent.outcome }}
        run: test "$OUTCOME" = failure
      - id: result-without-field
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: a
          results: '{"a":{}}'
      - name: result-without-field ended failure
        env:
          OUTCOME: ${{ steps.result-without-field.outcome }}
        run: test "$OUTCOME" = failure
      - id: results-not-json
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: a
          results: 'not json'
      - name: results-not-json ended failure
        env:
          OUTCOME: ${{ steps.results-not-json.outcome }}
        run: test "$OUTCOME" = failure
      - id: results-an-array
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: a
          results: '["success"]'
      - name: results-an-array ended failure
        env:
          OUTCOME: ${{ steps.results-an-array.outcome }}
        run: test "$OUTCOME" = failure
      - id: jobs-name-none
        continue-on-error: true
        uses: ./.github/actions/check-aggregate
        with:
          jobs: ' '
          results: '{}'
      - name: jobs-name-none ended failure
        env:
          OUTCOME: ${{ steps.jobs-name-none.outcome }}
        run: test "$OUTCOME" = failure
