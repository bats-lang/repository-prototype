# Tests relock-pins.yml (#395, area: relock comment) as check-aggregate-test.yml
# tests its action: the workflow in the checked-out head (a local path) relocks
# a scratch caller (tests/relock-pins/workflows/scratch-caller.yml, named by
# `workflows-directory`; `publish: 'false'` pushes nothing) and the change it
# hands on is read. Every `uses:` line it moved must be
# `uses: <pin>@<new commit> # <repo> main <first 7 hex>` and nothing else.
# A step then plays that rule against three bad patches (no comment, two
# comments, the wrong 7 hex) and each must fail it. The `rewrite` job runs the
# very awk program of relock-pins.yml (between its pin-rewrite markers) on the
# fixtures of tests/relock-pins/rewrite: pins already at the newest commit with
# another comment are rewritten to the one form, a line already in it is left
# byte-identical, and a quoted value, flow style, a commented-out `uses:` line
# and text after the token are refused with the file, the line number and the
# line, and nothing is written.
#
# The action pins (#414, area: repin actions): `actions` runs the workflow on
# tests/relock-pins/actions/workflows with a releases file and a time of the
# test (`actions-releases`, `actions-now`; nothing is fetched and the clock is
# not read) and `actions-check` compares the patch it hands on with
# expected.patch and the `### Actions` section of its body with
# expected-section.md; `actions-current` runs it on a directory whose pins are
# all current (changed is no, no patch, no body); the first job above, which
# gives neither input and whose workflows hold no third-party action, must have
# no `### Actions` section (a caller that passes nothing new is relocked as
# before). `actions-left` runs the awk programs between the `actions-left` and
# `actions-bullet` markers of relock-pins.yml, which list the moves a run with
# no RELOCK_TOKEN cannot make as `not moved`, on fixture records.
# `actions-fetch` gives neither input, so the releases of a fixture's real
# actions/checkout pin (v4.0.0) are fetched from GitHub, and
# `actions-fetch-check` requires a move to a v4 release at least 7 days old.
# The repin command (#420, area: repin command): `repin-moves` runs the
# workflow with a command that moves a fixture file and writes one record, and
# `repin-nothing` one that moves nothing; `repin` then reads the patch, the
# body and `changed`. `repin-refusals` runs the script between the
# `repin-check` markers of relock-pins.yml on fixture repositories (a write
# outside the paths, a link, a failing command, a refused path, a record file
# removed), and a dispatch with the input `refusal` runs one such command
# through the whole workflow, which must end red with relock and publish not
# run. `repin-compat` runs the workflow with none of the repin inputs and
# reads the same outputs as before.
# A dispatch with `refusal` runs only that case: the calls of the other jobs
# share concurrency groups with the pull request's run and would cancel each
# other's pending jobs.
name: relock-pins test

on:
  pull_request:
    paths:
      - '.github/workflows/relock-pins.yml'
      - '.github/workflows/relock-pins-test.yml'
      - 'tests/relock-pins/**'
  workflow_dispatch:
    inputs:
      refusal:
        description: >-
          Run the repin command of this case (outside, link, fails or
          bad-record) through relock-pins.yml: the run must be red, with the
          relock and publish jobs not run
        type: string
        default: ''

permissions: {}

jobs:
  relock:
    if: inputs.refusal == ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.event.pull_request.head.sha || github.sha }}
      workflows-directory: tests/relock-pins/workflows
      workflow-pins: |
        bats-lang/repository-prototype/.github/workflows/publish.yml
        bats-lang/bats/.github/actions/setup
      pin-copies: |
        bats-lang/repository-prototype/.github/workflows/publish.yml source-ref
      publish: 'false'
      branch-prefix: relock-test/

  check:
    needs: relock
    runs-on: ubuntu-24.04
    env:
      CHANGED: ${{ needs.relock.outputs.changed }}
      PATCH: ${{ needs.relock.outputs.patch }}
    steps:
      - name: The moved pin lines carry the comment
        run: |
          set -eu
          [ "$CHANGED" = yes ] || { echo "::error::the scratch caller's pins did not move (changed=$CHANGED)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/t"
          printf '%s' "$PATCH" | base64 -d | gunzip > "$RUNNER_TEMP/t/good.patch"
          cat "$RUNNER_TEMP/t/good.patch"

          # The rule: each added line with `uses:` is exactly
          # `uses: <owner>/<repo>/<path>@<40 hex> # <repo> main <7 hex>`, the
          # 7 hex are the first of the 40, and the commit is not the old one.
          # Three lines are expected: the scratch caller's.
          cat > "$RUNNER_TEMP/t/rule.sh" <<'RULE'
          set -eu
          count=0
          while IFS= read -r line; do
            case "$line" in
              +*uses:*) ;;
              *) continue ;;
            esac
            count=$((count + 1))
            if ! printf '%s\n' "$line" | grep -Eq '^\+ *(- )?uses: [A-Za-z0-9._-]+/[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+@[0-9a-f]{40} # [A-Za-z0-9._-]+ main [0-9a-f]{7}$'; then
              echo "refused: $line"; exit 1
            fi
            use=${line#*uses: }
            pin=${use%%@*}
            rest=${use#*@}
            commit=${rest%% *}
            repo=$(printf '%s' "$pin" | cut -d/ -f2)
            [ "${rest#"$commit # $repo main "}" = "$(printf '%.7s' "$commit")" ] \
              || { echo "refused (comment is not '$repo main <first 7 of the commit>'): $line"; exit 1; }
            case "$commit" in
              67ebbf0c4744edce26584eef60ea26438945bab7|678ecb3*) echo "refused (not moved): $line"; exit 1 ;;
            esac
          done < "$1"
          [ "$count" -eq 3 ] || { echo "refused: $count added uses lines, expected 3"; exit 1; }
          RULE
          sh "$RUNNER_TEMP/t/rule.sh" "$RUNNER_TEMP/t/good.patch"
          echo "the moved lines carry the comment"

      - name: The copy of the pin moves with it and nothing else does
        run: |
          set -eu
          cd "$RUNNER_TEMP/t"
          pin=$(awk '/^\+.*uses: bats-lang\/repository-prototype\/.github\/workflows\/publish.yml@/ { t = $0; sub(/^.*@/, "", t); sub(/ .*$/, "", t); print t; exit }' good.patch)
          copy=$(awk '/^\+ *source-ref: / { print $3; exit }' good.patch)
          [ -n "$pin" ] && [ "$copy" = "$pin" ] \
            || { echo "::error::source-ref is '$copy', the pin moved to '$pin'"; exit 1; }
          if grep -q '^+ *other-ref:' good.patch; then
            echo "::error::a line that is not a copy was changed"; exit 1
          fi
          echo "source-ref moved with the pin to $pin; other-ref was left alone"

      - name: A missing, a doubled and a wrong comment are refused
        run: |
          set -eu
          cd "$RUNNER_TEMP/t"
          # rewrite the added uses lines of the good patch, one way per patch
          awk '/^\+.*uses:/ { sub(/ # .*/, "") } { print }' good.patch > missing.patch
          awk '/^\+.*uses:/ { $0 = $0 " # v1" } { print }' good.patch > doubled.patch
          awk '/^\+.*uses:/ { sub(/ main [0-9a-f][0-9a-f]*$/, " main 0000000") } { print }' good.patch > wrong.patch
          for bad in missing doubled wrong; do
            if sh rule.sh "$bad.patch"; then
              echo "::error::the rule accepted the $bad patch"; exit 1
            fi
            echo "the $bad patch is refused"
          done

  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The pin lines are healed, kept or refused
        run: |
          set -eu
          work="$RUNNER_TEMP/rewrite"
          mkdir -p "$work"
          # the program as relock-pins.yml has it, between its markers
          awk '/# pin-rewrite end/ { on = 0 } on { print } /# pin-rewrite begin/ { on = 1 }' \
            .github/workflows/relock-pins.yml > "$work/rewrite.awk"
          [ -s "$work/rewrite.awk" ] || { echo "::error::no pin-rewrite program in relock-pins.yml"; exit 1; }
          pin=bats-lang/repository-prototype/.github/workflows/publish.yml@
          newest=1111111111111111111111111111111111111111
          comment="repository-prototype main 1111111"
          run_awk() {
            awk -v pin="$pin" -v newest="$newest" -v comment="$comment" -v file="$1" -f "$work/rewrite.awk" "$1"
          }
          dir=tests/relock-pins/rewrite

          run_awk "$dir/heal.yml" > "$work/heal.out"
          cmp "$work/heal.out" "$dir/heal.expected.yml" \
            || { echo "::error::a pin at the newest commit with another comment was not rewritten to the one form"; diff "$dir/heal.expected.yml" "$work/heal.out" || true; exit 1; }
          echo "other comments (a wrong 7 hex, # v4, other words, none) are rewritten to the one form"

          run_awk "$dir/keep.yml" > "$work/keep.out"
          cmp "$work/keep.out" "$dir/keep.yml" \
            || { echo "::error::a line already in the one form was changed"; exit 1; }
          echo "a line in the one form is byte-identical"

          # the copies: every line of the key moves, other keys stay, odd spellings are refused
          awk '/# copy-rewrite end/ { on = 0 } on { print } /# copy-rewrite begin/ { on = 1 }' \
            .github/workflows/relock-pins.yml > "$work/copy.awk"
          [ -s "$work/copy.awk" ] || { echo "::error::no copy-rewrite program in relock-pins.yml"; exit 1; }
          copies=tests/relock-pins/copies
          awk -v input=pwa-ref -v newest="$newest" -v file="$copies/move.yml" -f "$work/copy.awk" "$copies/move.yml" > "$work/move.out"
          cmp "$work/move.out" "$copies/move.expected.yml" \
            || { echo "::error::the copies were not moved as the fixture expects"; diff "$copies/move.expected.yml" "$work/move.out" || true; exit 1; }
          echo "every pwa-ref line moved to the newest commit; other lines are byte-identical"
          for name in quoted short expression; do
            if awk -v input=pwa-ref -v newest="$newest" -v file="$copies/refuse-$name.yml" -f "$work/copy.awk" "$copies/refuse-$name.yml" > "$work/c-$name.out"; then
              echo "::error::the $name copy was not refused"; exit 1
            fi
            grep -Fq "file=$copies/refuse-$name.yml,line=2" "$work/c-$name.out" \
              || { echo "::error::the $name copy refusal does not name the file and line"; cat "$work/c-$name.out"; exit 1; }
            echo "the $name copy is refused: $(grep -F '::error' "$work/c-$name.out")"
          done

          for name in quoted flow commented comma; do
            if run_awk "$dir/refuse-$name.yml" > "$work/$name.out" 2> "$work/$name.err"; then
              echo "::error::the $name spelling was not refused"; exit 1
            fi
            cat "$work/$name.err"
            # the refusal names the file, the line number and the line
            grep -Fq "file=$dir/refuse-$name.yml,line=" "$work/$name.out" \
              || { echo "::error::the $name refusal does not name the file and the line number"; cat "$work/$name.out"; exit 1; }
            echo "the $name spelling is refused: $(grep -F '::error' "$work/$name.out")"
          done

  actions:
    if: inputs.refusal == ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.event.pull_request.head.sha || github.sha }}
      workflows-directory: tests/relock-pins/actions/workflows
      actions-releases: tests/relock-pins/actions/releases.txt
      actions-now: '1700000000'
      publish: 'false'
      branch-prefix: relock-test-actions/

  actions-current:
    if: inputs.refusal == ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.event.pull_request.head.sha || github.sha }}
      workflows-directory: tests/relock-pins/actions/workflows-current
      actions-releases: tests/relock-pins/actions/releases.txt
      actions-now: '1700000000'
      publish: 'false'
      branch-prefix: relock-test-actions-current/

  actions-check:
    needs: [relock, actions, actions-current]
    runs-on: ubuntu-24.04
    env:
      MOVES_CHANGED: ${{ needs.actions.outputs.changed }}
      MOVES_PATCH: ${{ needs.actions.outputs.patch }}
      MOVES_BODY: ${{ needs.actions.outputs.body }}
      CURRENT_CHANGED: ${{ needs.actions-current.outputs.changed }}
      CURRENT_PATCH: ${{ needs.actions-current.outputs.patch }}
      CURRENT_BODY: ${{ needs.actions-current.outputs.body }}
      COMPAT_CHANGED: ${{ needs.relock.outputs.changed }}
      COMPAT_BODY: ${{ needs.relock.outputs.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The patch is the expected one
        run: |
          set -eu
          [ "$MOVES_CHANGED" = yes ] || { echo "::error::the outdated pin did not move (changed=$MOVES_CHANGED)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/a"
          printf '%s' "$MOVES_PATCH" | base64 -d | gunzip > "$RUNNER_TEMP/a/moves.patch"
          cat "$RUNNER_TEMP/a/moves.patch"
          cmp "$RUNNER_TEMP/a/moves.patch" tests/relock-pins/actions/expected.patch \
            || { echo "::error::the patch is not the expected one"; diff tests/relock-pins/actions/expected.patch "$RUNNER_TEMP/a/moves.patch" || true; exit 1; }
          echo "the patch is the expected one"

      - name: The body lists each pin examined in the Actions section
        run: |
          set -eu
          printf '%s' "$MOVES_BODY" | base64 -d > "$RUNNER_TEMP/a/moves.md"
          cat "$RUNNER_TEMP/a/moves.md"
          awk '/^### Actions$/ { on = 1 } /^If a check here fails/ { on = 0 } on { print }' "$RUNNER_TEMP/a/moves.md" > "$RUNNER_TEMP/a/section.md"
          cmp "$RUNNER_TEMP/a/section.md" tests/relock-pins/actions/expected-section.md \
            || { echo "::error::the Actions section is not the expected one"; diff tests/relock-pins/actions/expected-section.md "$RUNNER_TEMP/a/section.md" || true; exit 1; }
          echo "the Actions section is the expected one"

      - name: Every pin current opens no pull request
        run: |
          set -eu
          [ "$CURRENT_CHANGED" = no ] || { echo "::error::changed is '$CURRENT_CHANGED', every action pin is current"; exit 1; }
          [ -z "$CURRENT_PATCH" ] && [ -z "$CURRENT_BODY" ] \
            || { echo "::error::a run with every action pin current handed on a change"; exit 1; }
          echo "changed=no, no patch, no body"

      - name: A caller that passes nothing new is relocked as before
        run: |
          set -eu
          [ "$COMPAT_CHANGED" = yes ] || { echo "::error::the scratch caller's pins did not move (changed=$COMPAT_CHANGED)"; exit 1; }
          printf '%s' "$COMPAT_BODY" | base64 -d > "$RUNNER_TEMP/a/compat.md"
          if grep -q '^### Actions' "$RUNNER_TEMP/a/compat.md"; then
            echo "::error::a caller with no third-party action got an Actions section"; exit 1
          fi
          echo "no Actions section for a caller with no third-party action"

  actions-left:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Without a RELOCK_TOKEN the moves are listed as not moved
        run: |
          set -eu
          work="$RUNNER_TEMP/actions-left"
          mkdir -p "$work"
          dir=tests/relock-pins/actions
          # the programs as relock-pins.yml has them, between their markers
          awk '/# actions-left end/ { on = 0 } on { print } /# actions-left begin/ { on = 1 }' \
            .github/workflows/relock-pins.yml > "$work/split.awk"
          awk '/# actions-bullet end/ { on = 0 } on { print } /# actions-bullet begin/ { on = 1 }' \
            .github/workflows/relock-pins.yml > "$work/bullet.awk"
          [ -s "$work/split.awk" ] && [ -s "$work/bullet.awk" ] \
            || { echo "::error::no actions-left or actions-bullet program in relock-pins.yml"; exit 1; }
          : > "$work/shown"
          : > "$work/left"
          awk -F'\t' -v shown="$work/shown" -v left="$work/left" -f "$work/split.awk" "$dir/records-left.txt"
          cmp "$work/shown" "$dir/shown.expected.txt" \
            || { echo "::error::the records kept in the table are not the expected ones"; diff "$dir/shown.expected.txt" "$work/shown" || true; exit 1; }
          cmp "$work/left" "$dir/left.expected.txt" \
            || { echo "::error::the moves not made are not the expected ones"; diff "$dir/left.expected.txt" "$work/left" || true; exit 1; }
          awk -F'\t' -f "$work/bullet.awk" "$work/left" > "$work/bullets"
          cat "$work/bullets"
          cmp "$work/bullets" "$dir/left.expected.md" \
            || { echo "::error::the list of moves not made is not the expected one"; diff "$dir/left.expected.md" "$work/bullets" || true; exit 1; }
          echo "a move that cannot be made is listed as not moved; the other records stay in the table"

  actions-fetch:
    if: inputs.refusal == ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.event.pull_request.head.sha || github.sha }}
      workflows-directory: tests/relock-pins/actions/fetch
      publish: 'false'
      branch-prefix: relock-test-actions-fetch/

  # the releases come from GitHub here, so the rule is on the form of the move,
  # not on a fixed newest: the pin moves to a v4 release at least 7 days old
  actions-fetch-check:
    needs: actions-fetch
    runs-on: ubuntu-24.04
    env:
      CHANGED: ${{ needs.actions-fetch.outputs.changed }}
      PATCH: ${{ needs.actions-fetch.outputs.patch }}
      BODY: ${{ needs.actions-fetch.outputs.body }}
    steps:
      - name: The outdated pin moved to a release of its major at least 7 days old
        run: |
          set -eu
          [ "$CHANGED" = yes ] || { echo "::error::the outdated pin did not move (changed=$CHANGED)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/f"
          printf '%s' "$PATCH" | base64 -d | gunzip > "$RUNNER_TEMP/f/fetch.patch"
          printf '%s' "$BODY" | base64 -d > "$RUNNER_TEMP/f/fetch.md"
          cat "$RUNNER_TEMP/f/fetch.patch" "$RUNNER_TEMP/f/fetch.md"
          [ "$(grep -c '^diff --git' "$RUNNER_TEMP/f/fetch.patch")" = 1 ] \
            || { echo "::error::the patch is not the one file"; exit 1; }
          grep -Fxq -- '-      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4.0.0' "$RUNNER_TEMP/f/fetch.patch" \
            || { echo "::error::the old line is not removed"; exit 1; }
          added=$(grep -E '^\+ +- uses: ' "$RUNNER_TEMP/f/fetch.patch")
          printf '%s\n' "$added" | grep -Eq '^\+      - uses: actions/checkout@[0-9a-f]{40} # v4\.[0-9]+\.[0-9]+$' \
            || { echo "::error::the new line is not a pin of a v4 release: $added"; exit 1; }
          case "$added" in *1e31de5234b9f8995739874a8ce0492dc87873e2*) echo "::error::the commit did not change"; exit 1 ;; esac
          grep -Eq '^\| action \| actions/checkout \| v4\.0\.0 \| v4\.[0-9]+\.[0-9]+ \| ([7-9]|[1-9][0-9]+) days \| moved \|$' "$RUNNER_TEMP/f/fetch.md" \
            || { echo "::error::the body does not list the move with a release age of at least 7 days"; exit 1; }
          echo "the pin moved to a v4 release at least 7 days old, and the body lists it"

  actions-tags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A tag's commit is the one it points to, an annotated tag's dereferenced
        run: |
          set -eu
          work="$RUNNER_TEMP/actions-tags"
          mkdir -p "$work"
          awk '/# tag-commit end/ { on = 0 } on { print } /# tag-commit begin/ { on = 1 }' \
            .github/workflows/relock-pins.yml > "$work/commit.awk"
          [ -s "$work/commit.awk" ] || { echo "::error::no tag-commit program in relock-pins.yml"; exit 1; }
          tags=tests/relock-pins/actions/tags.txt
          # tag_case TAG EXPECTED-COMMIT (empty: no commit)
          tag_case() {
            got=$(awk -v ref="refs/tags/$1" -f "$work/commit.awk" "$tags")
            [ "$got" = "$2" ] || { echo "::error::tag $1: got '$got', expected '$2'"; exit 1; }
            echo "tag $1: ${got:-none}"
          }
          tag_case v1.0.0 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          tag_case v1.1.0 cccccccccccccccccccccccccccccccccccccccc
          tag_case v1.1 ''
          tag_case v2.0.0 ''
  # a caller that passes no repin input gets today's relock: the scratch
  # caller's pin moves, as in the job above, and nothing mentions repin
  repin-compat:
    if: inputs.refusal == ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.event.pull_request.head.sha || github.sha }}
      workflows-directory: tests/relock-pins/workflows
      workflow-pins: |
        bats-lang/repository-prototype/.github/workflows/publish.yml
      publish: 'false'
      branch-prefix: relock-test-compat/

  repin-moves:
    if: inputs.refusal == ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.event.pull_request.head.sha || github.sha }}
      workflows-directory: tests/relock-pins/workflows
      repin-command: |
        printf 'new\n' > tests/relock-pins/repin/pin.txt
        printf 'fixture\tpin.txt\told\tnew\t8\tmoved\n' >> "$REPIN_RECORDS"
      repin-paths: |
        tests/relock-pins/repin
      publish: 'false'
      branch-prefix: relock-test-moves/

  # the Actions section and the repin records in one body: the records follow
  repin-with-actions:
    if: inputs.refusal == ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.event.pull_request.head.sha || github.sha }}
      workflows-directory: tests/relock-pins/actions/workflows
      actions-releases: tests/relock-pins/actions/releases.txt
      actions-now: '1700000000'
      repin-command: |
        printf 'new\n' > tests/relock-pins/repin/pin.txt
        printf 'fixture\tpin.txt\told\tnew\t8\tmoved\n' >> "$REPIN_RECORDS"
      repin-paths: |
        tests/relock-pins/repin
      publish: 'false'
      branch-prefix: relock-test-with-actions/

  repin-nothing:
    if: inputs.refusal == ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.event.pull_request.head.sha || github.sha }}
      workflows-directory: tests/relock-pins/workflows
      repin-command: |
        printf 'fixture\tpin.txt\told\told\t8\tcurrent\n' >> "$REPIN_RECORDS"
      repin-paths: |
        tests/relock-pins/repin
      publish: 'false'
      branch-prefix: relock-test-nothing/

  repin-refused:
    if: github.event_name == 'workflow_dispatch' && inputs.refusal != ''
    uses: ./.github/workflows/relock-pins.yml
    with:
      base: ${{ github.sha }}
      workflows-directory: tests/relock-pins/workflows
      repin-command: ${{ inputs.refusal == 'outside' && 'echo x > tests/relock-pins/outside.txt' || inputs.refusal == 'link' && 'ln -s /etc/passwd tests/relock-pins/repin/link' || inputs.refusal == 'bad-record' && 'echo not-a-record >> "$REPIN_RECORDS"' || 'exit 3' }}
      repin-paths: |
        tests/relock-pins/repin
      publish: 'false'
      branch-prefix: relock-test-refused-${{ inputs.refusal }}/

  repin:
    needs: [repin-compat, repin-moves, repin-nothing, repin-with-actions]
    runs-on: ubuntu-24.04
    env:
      COMPAT_CHANGED: ${{ needs.repin-compat.outputs.changed }}
      COMPAT_PATCH: ${{ needs.repin-compat.outputs.patch }}
      COMPAT_BODY: ${{ needs.repin-compat.outputs.body }}
      MOVES_CHANGED: ${{ needs.repin-moves.outputs.changed }}
      MOVES_PATCH: ${{ needs.repin-moves.outputs.patch }}
      MOVES_BODY: ${{ needs.repin-moves.outputs.body }}
      NOTHING_CHANGED: ${{ needs.repin-nothing.outputs.changed }}
      NOTHING_PATCH: ${{ needs.repin-nothing.outputs.patch }}
      NOTHING_BODY: ${{ needs.repin-nothing.outputs.body }}
      BOTH_BODY: ${{ needs.repin-with-actions.outputs.body }}
    steps:
      - name: A command that moves a file and writes a record, the patch holds the file and the body the record
        run: |
          set -eu
          [ "$MOVES_CHANGED" = yes ] || { echo "::error::the moved fixture was not seen (changed=$MOVES_CHANGED)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/r"
          printf '%s' "$MOVES_PATCH" | base64 -d | gunzip > "$RUNNER_TEMP/r/moves.patch"
          printf '%s' "$MOVES_BODY" | base64 -d > "$RUNNER_TEMP/r/moves.md"
          cat "$RUNNER_TEMP/r/moves.patch" "$RUNNER_TEMP/r/moves.md"
          [ "$(grep -c '^diff --git' "$RUNNER_TEMP/r/moves.patch")" = 1 ] \
            || { echo "::error::the patch is not the one file"; exit 1; }
          grep -Fxq 'diff --git a/tests/relock-pins/repin/pin.txt b/tests/relock-pins/repin/pin.txt' "$RUNNER_TEMP/r/moves.patch" \
            || { echo "::error::the patch does not name the fixture file"; exit 1; }
          grep -Fxq -- '-old' "$RUNNER_TEMP/r/moves.patch" && grep -Fxq -- '+new' "$RUNNER_TEMP/r/moves.patch" \
            || { echo "::error::the patch does not hold the change old to new"; exit 1; }
          grep -Fxq '### Moved by the repin command' "$RUNNER_TEMP/r/moves.md" \
            || { echo "::error::the body has no section for the repin records"; exit 1; }
          grep -Fxq '| fixture | pin.txt | old | new | 8 days | moved |' "$RUNNER_TEMP/r/moves.md" \
            || { echo "::error::the body does not list the record"; exit 1; }
          echo "the patch holds the file's change and the body lists the record"

      - name: The repin records follow the Actions section
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/r"
          printf '%s' "$BOTH_BODY" | base64 -d > "$RUNNER_TEMP/r/both.md"
          cat "$RUNNER_TEMP/r/both.md"
          actions_line=$(grep -n '^### Actions$' "$RUNNER_TEMP/r/both.md" | cut -d: -f1)
          repin_line=$(grep -n '^### Moved by the repin command$' "$RUNNER_TEMP/r/both.md" | cut -d: -f1)
          [ -n "$actions_line" ] && [ -n "$repin_line" ] && [ "$actions_line" -lt "$repin_line" ] \
            || { echo "::error::the sections are at lines '$actions_line' and '$repin_line', expected Actions first"; exit 1; }
          echo "### Actions is at line $actions_line, the repin records at line $repin_line"

      - name: A command that moves nothing, changed is no
        run: |
          set -eu
          [ "$NOTHING_CHANGED" = no ] || { echo "::error::changed is '$NOTHING_CHANGED', the command moved nothing"; exit 1; }
          [ -z "$NOTHING_PATCH" ] && [ -z "$NOTHING_BODY" ] \
            || { echo "::error::a run that moved nothing handed on a change"; exit 1; }
          echo "changed=no, no patch, no body"

      - name: A caller with no repin input relocks as before
        run: |
          set -eu
          [ "$COMPAT_CHANGED" = yes ] || { echo "::error::the scratch caller's pin did not move (changed=$COMPAT_CHANGED)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/r"
          printf '%s' "$COMPAT_PATCH" | base64 -d | gunzip > "$RUNNER_TEMP/r/compat.patch"
          printf '%s' "$COMPAT_BODY" | base64 -d > "$RUNNER_TEMP/r/compat.md"
          grep -q '^+.*uses: bats-lang/repository-prototype/.github/workflows/publish.yml@[0-9a-f]\{40\} # repository-prototype main ' "$RUNNER_TEMP/r/compat.patch" \
            || { echo "::error::the pin line did not move"; exit 1; }
          if grep -q 'repin' "$RUNNER_TEMP/r/compat.patch" "$RUNNER_TEMP/r/compat.md"; then
            echo "::error::a run with no repin input mentions repin"; exit 1
          fi
          echo "the pin moved, and neither the patch nor the body mentions repin"

  repin-refusals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The repin script refuses a write outside the paths, a link, a failure and a refused path
        run: |
          set -eu
          work="$RUNNER_TEMP/repin-refusals"
          mkdir -p "$work"
          # the script as relock-pins.yml has it, between its markers
          awk '/# repin-check end/ { on = 0 } on { print } /# repin-check begin/ { on = 1 }' \
            .github/workflows/relock-pins.yml > "$work/check.sh"
          [ -s "$work/check.sh" ] || { echo "::error::no repin-check script in relock-pins.yml"; exit 1; }
          fixture=$PWD/tests/relock-pins/repin

          # run_case NAME EXPECT COMMAND PATHS [MESSAGE]: the script in a fresh
          # git repository holding the fixture, a tracked README and a .gitignore
          run_case() {
            name=$1; expect=$2; command=$3; paths=$4; message=${5:-}
            repo="$work/$name/repo"
            mkdir -p "$repo/fixture" "$work/$name/tmp"
            cp "$fixture"/*.txt "$repo/fixture/"
            printf 'readme\n' > "$repo/README"
            printf 'build/\n' > "$repo/.gitignore"
            git -C "$repo" init -q
            git -C "$repo" add -A
            git -C "$repo" -c user.name=t -c user.email=t@example.com commit -q -m fixture
            status=0
            (cd "$repo" && RUNNER_TEMP="$work/$name/tmp" REPIN_COMMAND="$command" REPIN_PATHS="$paths" MAX_BYTES=1000000 bash "$work/check.sh") \
              > "$work/$name/out" 2>&1 || status=$?
            cat "$work/$name/out"
            if [ "$expect" = ok ]; then
              [ "$status" -eq 0 ] || { echo "::error::case $name: refused (status $status), expected it to pass"; exit 1; }
              [ -s "$work/$name/tmp/repin/files.tar" ] || { echo "::error::case $name: no tar"; exit 1; }
            else
              [ "$status" -ne 0 ] || { echo "::error::case $name: passed, expected a refusal"; exit 1; }
              [ ! -e "$work/$name/tmp/repin/files.tar" ] || { echo "::error::case $name: refused but a tar was made"; exit 1; }
              if [ -n "$message" ]; then
                grep -Fq -- "$message" "$work/$name/out" || { echo "::error::case $name: no message '$message'"; exit 1; }
              fi
            fi
            echo "case $name: $expect"
          }

          move='printf "new\n" > fixture/pin.txt; printf "fixture\tpin.txt\told\tnew\t8\tmoved\n" >> "$REPIN_RECORDS"'
          run_case moves ok "$move" fixture
          tar -tf "$work/moves/tmp/repin/files.tar" | grep -Fxq fixture/pin.txt
          grep -Fq 'fixture	pin.txt	old	new	8	moved' "$work/moves/tmp/repin/records"
          run_case nothing ok ':' fixture
          [ ! -s "$work/nothing/tmp/repin/records" ]
          run_case outside-new fail 'echo x > outside.txt' fixture 'wrote outside repin-paths: outside.txt'
          run_case outside-tracked fail 'echo x >> README' fixture 'wrote outside repin-paths: README'
          run_case outside-deleted fail 'rm README' fixture 'wrote outside repin-paths: README'
          run_case outside-ignored fail 'mkdir build; echo x > build/x' fixture 'wrote outside repin-paths: build/'
          run_case sibling fail 'echo x > fixture-two' fixture 'wrote outside repin-paths: fixture-two'
          run_case link-inside fail 'ln -s /etc/passwd fixture/link' fixture 'holds something that is not a regular file or a directory'
          run_case link-path fail 'rm fixture/pin.txt; ln -s other.txt fixture/pin.txt' fixture/pin.txt 'is a link'
          run_case fails fail 'exit 3' fixture
          run_case writes-then-fails fail 'echo x > fixture/pin.txt; exit 3' fixture
          run_case path-gone fail 'rm -r fixture' fixture 'left no fixture'
          run_case records-removed fail 'rm "$REPIN_RECORDS"' fixture 'removed or replaced the file REPIN_RECORDS'
          run_case no-paths fail ':' '' 'without repin-paths'
          run_case path-dotdot fail ':' '../x' 'path that is refused: ../x'
          run_case path-github fail ':' '.github' 'path that is refused: .github'
          run_case path-git-deep fail ':' 'fixture/.GIT' 'path that is refused: fixture/.GIT'
          run_case path-absolute fail ':' '/etc' 'path that is refused: /etc'
          run_case path-dash fail ':' '-fixture' 'path that is refused: -fixture'

  repin-take:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The relock job takes the repinned files as data and refuses what is not
        run: |
          set -eu
          work="$RUNNER_TEMP/repin-take"
          mkdir -p "$work"
          # the Python as relock-pins.yml has it, between its markers
          awk '/# repin-take end/ { on = 0 } on { sub(/^ {10}/, ""); print } /# repin-take begin/ { on = 1 }' \
            .github/workflows/relock-pins.yml > "$work/take.py"
          [ -s "$work/take.py" ] || { echo "::error::no repin-take program in relock-pins.yml"; exit 1; }
          # take_case NAME EXPECT MEMBERS: a tar made by $work/make.py from MEMBERS
          # (kind:name, kind file, dir, link, device) is taken in a checkout of the fixture
          cat > "$work/make.py" <<'MAKE'
          import io, sys, tarfile
          with tarfile.open(sys.argv[1], 'w') as archive:
              for spec in sys.argv[2:]:
                  kind, name = spec.split(':', 1)
                  member = tarfile.TarInfo(name)
                  if kind == 'dir':
                      member.type = tarfile.DIRTYPE
                      member.mode = 0o755
                      archive.addfile(member)
                  elif kind == 'link':
                      member.type = tarfile.SYMTYPE
                      member.linkname = '/etc/passwd'
                      archive.addfile(member)
                  elif kind == 'device':
                      member.type = tarfile.CHRTYPE
                      archive.addfile(member)
                  else:
                      data = b'new\n'
                      member.size = len(data)
                      member.mode = 0o644
                      archive.addfile(member, io.BytesIO(data))
          MAKE
          take_case() {
            name=$1; expect=$2; cap=$3; paths=$4; shift 4
            mkdir -p "$work/$name/checkout/tests/relock-pins/repin" "$work/$name/tmp/repin"
            cp tests/relock-pins/repin/*.txt "$work/$name/checkout/tests/relock-pins/repin/"
            python3 -I "$work/make.py" "$work/$name/tmp/repin/files.tar" "$@"
            status=0
            (cd "$work/$name/checkout" && RUNNER_TEMP="$work/$name/tmp" REPIN_PATHS="$paths" REPIN_MAX_BYTES="$cap" python3 -I - "$work/$name/tmp/repin/files.tar" < "$work/take.py") \
              > "$work/$name/out" 2>&1 || status=$?
            cat "$work/$name/out"
            if [ "$expect" = ok ]; then
              [ "$status" -eq 0 ] || { echo "::error::take case $name: refused, expected it to pass"; exit 1; }
            else
              [ "$status" -ne 0 ] || { echo "::error::take case $name: taken, expected a refusal"; exit 1; }
              grep -Fq '::error::' "$work/$name/out" || { echo "::error::take case $name: no message"; exit 1; }
              # a refused tar leaves the checkout's files as they were
              [ "$(cat "$work/$name/checkout/tests/relock-pins/repin/pin.txt")" = old ] \
                || { echo "::error::take case $name: refused but the file changed"; exit 1; }
            fi
            echo "take case $name: $expect"
          }
          paths=tests/relock-pins/repin
          good="dir:tests/relock-pins/repin file:tests/relock-pins/repin/pin.txt file:tests/relock-pins/repin/other.txt"
          take_case good ok 1000 "$paths" $good
          [ "$(cat "$work/good/checkout/tests/relock-pins/repin/pin.txt")" = new ]
          take_case link fail 1000 "$paths" $good link:tests/relock-pins/repin/link
          take_case device fail 1000 "$paths" $good device:tests/relock-pins/repin/device
          take_case outside fail 1000 "$paths" $good file:tests/relock-pins/outside.txt
          take_case sibling fail 1000 "$paths" $good file:tests/relock-pins/repin-two/x.txt
          take_case dotdot fail 1000 "$paths" $good file:tests/relock-pins/repin/../../x.txt
          take_case github fail 1000 "$paths" $good file:tests/relock-pins/repin/.github/x.txt
          take_case over-cap fail 6 "$paths" $good
          take_case path-missing fail 1000 "$(printf 'tests/relock-pins/repin\ntests/relock-pins/gone')" $good
          take_case path-refused fail 1000 ".github" dir:.github
