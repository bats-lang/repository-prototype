# Daily: relock this package and move its CI pins to their newest, as a
# pull request that runs check.yml (bats-lang/repository-prototype#269).
# The work is the shared relock-pins.yml, called by commit.
name: relock

on:
  schedule:
    - cron: '7 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  relock:
    uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@648bd8abb5114ee15899d8cfa4b2dbd58b78d016 # repository-prototype main 648bd8a
    secrets: inherit
    with:
      workflow-pins: |
        bats-lang/repository-prototype/.github/workflows/publish.yml
        bats-lang/repository-prototype/.github/workflows/package-check.yml
        bats-lang/repository-prototype/.github/workflows/relock-pins.yml
