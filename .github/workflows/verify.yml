name: verify

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # bats's setup action, pinned by commit (#334, as #333 did for
      # relock-pins): the compiler built from the bootstrap C of the commit
      # named, ATS2 installed by `bats ats2 install` (SHA-256 checked), and
      # the package repository at the commit named. verify does not use the
      # package repository's clone: the checkout above is the one verified.
      # Both commits are given here, not read from .github/bats-version and
      # .github/repository-version: those are the relock's, for the pin audit
      # and the tools' tests (#448); verify is the exception named in CLAUDE.md.
      - name: Set up bats
        uses: bats-lang/bats/.github/actions/setup@8e978dfe7fac83726730361329c91b0e829beaad # bats main, PR #287 (bats has no version tags)
        with:
          bats-version: 67ebbf0c4744edce26584eef60ea26438945bab7
          repository-version: 63cb39e57c56eb97bf8420b431efb3cd885401c6
          require-lock: 'false'

      - name: Verify added archives
        run: |
          scripts/verify-archives.sh ${{ github.event.pull_request.base.sha }}
