# Relocks a bats project and moves its CI pins to their newest, as a pull
# request that its check workflow runs on (#269, from bats-lang/quire#203).
# Every package (and the compiler, and apps such as quire) calls it, by
# commit, from a small daily relock.yml:
#
#   name: relock
#   on:
#     schedule:
#       - cron: '17 5 * * *'
#     workflow_dispatch:
#   permissions:
#     contents: write        # push relock/<date>
#     pull-requests: write   # open its pull request
#     actions: write         # dispatch the check workflow on it
#     issues: write          # say when a setting stops the pull request
#   jobs:
#     relock:
#       uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@<commit>
#       secrets: inherit
#       with:
#         workflow-pins: |
#           bats-lang/repository-prototype/.github/workflows/publish.yml
#           bats-lang/repository-prototype/.github/workflows/relock-pins.yml
#
# A caller that commits something derived from its lock or pins (bats's
# bootstrap/c, the C of the compiler it compiles from its locked packages,
# bats-lang/bats#299) gives `regenerate`, a shell command run in its checkout
# after the pins moved and only when something did, with the newest bats on
# PATH and BATS_REPOSITORY set, and `regenerate-paths`, the files and
# directories it writes, one per line, which are committed with the pins.
# Both default to off, and then the run is the same relock as before.
#
# The command runs the code of the newest published packages (it builds them
# and runs the result), while the relock holds RELOCK_TOKEN, which can push and
# change workflow files. So privilege is separated by job, not guarded by a
# list of what the command must not touch:
#
#  1. relock: finds the newest, relocks, moves the pins, decides the branch
#     name (once, so a run that crosses midnight is one date) and hands the
#     change on as job outputs (a patch and the pull request's text). It
#     never runs the caller's command, and it has no token of its own (only
#     the repository's default GITHUB_TOKEN to check out, and whether a
#     RELOCK_TOKEN exists).
#  2. regenerate (permissions: {}, no secrets, a checkout with no
#     credentials, a timeout): applies the patch, runs the command, and
#     uploads one tar of the listed paths. It is a different runner from job
#     3, so whatever the command writes (GITHUB_ENV, GITHUB_PATH, .git/hooks,
#     the runner's tools, ~/relock) is gone with it.
#  3. publish (the only job with RELOCK_TOKEN): in its own clean checkout
#     applies the same patch, takes the tar as data only (the path rule
#     below; every member must be a regular file or directory under a listed
#     path, a size cap; the files are written by this job's own code, never
#     extracted by tar), commits, pushes and opens the pull request. The
#     command's only influence on it is the bytes of the listed regular files.
#
# What happens when the command goes wrong: if it fails (job 2 fails), or
# writes a link or anything else that is not a regular file or a directory,
# or too much, or a path outside the listed ones, or job 3 refuses its tar,
# the run is red and NOTHING is pushed: an existing relock branch of the day
# (a good one from an earlier run) is never replaced by one without the
# files, and the pins are not pushed without them either.
#
# The path rule, the same text in job 2's shell and job 3's Python, tested
# with the same cases: a path is refused when it is empty, starts with `/` or
# `-`, ends with `/`, has an empty, `.` or `..` component, has a character
# other than letters, digits and `._/@+=,-` (a newline included), or has a
# component that is, in any case, `.git`, `.github`, `.gitmodules` or
# `.gitattributes`, at any depth.
#
# Limits, a change from before regenerate existed: the change handed on
# (the patch, gzipped and base64) is under 100000 characters and the pull
# request's text under 20000, because a job output goes to a step as an
# environment variable (128 KiB); a relock larger than that fails with a
# message. The regenerated files are at most `regenerate-max-bytes`.
#
# Concurrency: the group is `relock-pins-<repository>-<branch-prefix>` (never
# cancelled), so one relock per repository and prefix runs at a time and a
# scheduled run and a dispatch with the same prefix cannot interleave their
# pushes. `branch-prefix` (default `relock/`) names the branch and the pull
# requests this run supersedes: a test run uses another prefix, so it runs
# beside, and cannot touch, the day's real relock.
#
# Do not give `regenerate` to a repository that is not public (job 2 has no
# permissions, so it cannot check out a private one), nor to one whose
# workflows use actions/cache or other state that a later run trusts: the
# command's job can write the cache for the caller's ref through the runner's
# cache token, which no permission setting takes away.
#
# The caller's pins, each moved only when the caller has it:
#
# - bats.lock: the packages, relocked against the newest package
#   repository (a package with no dependencies has none);
# - .github/bats-version: the compiler's commit, moved to its newest main;
# - .github/repository-version: the package repository's commit that CI
#   fetches, so what a test package locks (bats lock --dev in tests/) is
#   pinned too, moved to the commit relocked against;
# - each reusable workflow named in workflow-pins, called from
#   .github/workflows as <owner>/<repo>/<path>@<commit>, moved to its
#   repository's newest main commit. The line is written
#   `uses: <pin>@<commit> # <repo> main <first 7 hex of the commit>` (the
#   <repo> of <owner>/<repo>), replacing any comment the line had, so a line
#   never carries two: `bats check-pins` fails a commit with no comment saying
#   which version it is, and one form serves every repository (#395). It is
#   written for every pin line, moved or not, so a line left with another
#   comment is healed by the next relock. A line holding the pin that is not
#   `uses: <pin>@<token>` followed by nothing or a `#` comment (a quoted value,
#   flow style, a commented-out line, text after the token) fails the step.
#
# Every input of this file is pinned (#332): actions/checkout by commit, and
# the compiler, ATS2 and the package repository by bats's setup action
# (bats-lang/bats .github/actions/setup, by commit; its `bats ats2 install`
# checks the ATS2 tarball's SHA-256). Move that commit in a pull request of
# its own, with the commit of the newest bats that has the action.
#
# A run builds the compiler at its newest main, moves the pins, and when
# anything changed pushes relock/<date>, opens a pull request listing each
# old and new version (closing older relock pull requests), and dispatches
# the check workflow on that branch: a pull request opened with
# GITHUB_TOKEN starts no workflow, and workflow_dispatch is the
# documented exception. A breaking publish then shows as a red relock
# pull request, and main stays green.
#
# GITHUB_TOKEN cannot change files in .github/workflows. With a
# RELOCK_TOKEN secret (a fine-grained token on the repository with
# Contents, Pull requests and Workflows read and write) the workflow pins
# move too, and its pull request starts the checks itself; without one, a
# workflow pin that would move is listed in the pull request instead.
#
# Opening the pull request with GITHUB_TOKEN needs the setting "Allow
# GitHub Actions to create and approve pull requests" (the organization's,
# then the repository's). While it is off, a run still pushes the branch
# (deleting older relock branches) and dispatches the check, and keeps one
# "human only" issue that names the newest branch and says how to turn
# the setting on; the first run that opens its pull request closes it.
name: relock-pins

on:
  workflow_call:
    inputs:
      workflow-pins:
        description: Reusable workflows the caller pins by commit, <owner>/<repo>/<path> one per line
        type: string
        default: ''
      check-workflow:
        description: The workflow dispatched on the relock branch
        type: string
        default: check.yml
      package-repository:
        description: The package repository bats lock resolves against
        type: string
        default: bats-lang/repository-prototype
      compiler-repository:
        description: The bats compiler's repository, whose main .github/bats-version moves to
        type: string
        default: bats-lang/bats
      regenerate:
        description: >-
          Shell command run in the caller's checkout after the pins moved, when
          anything changed (the newest bats on PATH, BATS_REPOSITORY set), to
          regenerate files derived from the lock; empty runs nothing
        type: string
        default: ''
      regenerate-paths:
        description: >-
          Paths the regenerate command writes, one per line, committed with the
          pins (deletions included); required when regenerate is given
        type: string
        default: ''
      regenerate-max-bytes:
        description: The most bytes of the regenerated files the publish job accepts
        type: string
        default: '67108864'
      branch-prefix:
        description: >-
          The relock branch is <prefix><date>; older pull requests from
          branches with this prefix are superseded. A test run uses another
        type: string
        default: relock/
      regenerate-timeout-minutes:
        description: Minutes the caller's command and its job may take
        type: string
        default: '60'
      base:
        description: The branch relocked and the pull request's base
        type: string
        default: main
      workflows-directory:
        description: The directory whose files are searched for the workflow pins (a test uses a fixture's)
        type: string
        default: .github/workflows
      publish:
        description: >-
          'false' stops after the relock (and regenerate): nothing is pushed
          and no pull request is opened, and the change is the outputs. A test
          runs the relock so and reads what it would have pushed
        type: string
        default: 'true'
    outputs:
      changed:
        description: yes when a pin or the lock moved, else no
        value: ${{ jobs.relock.outputs.changed }}
      patch:
        description: The change as a patch, gzipped and base64 (empty when nothing moved)
        value: ${{ jobs.relock.outputs.patch }}
    secrets:
      RELOCK_TOKEN:
        required: false

concurrency:
  group: relock-pins-${{ github.repository }}-${{ inputs.branch-prefix }}
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      branch: ${{ steps.hand.outputs.branch }}
      date: ${{ steps.hand.outputs.date }}
      changed: ${{ steps.hand.outputs.changed }}
      head: ${{ steps.newest.outputs.head }}
      compiler: ${{ steps.newest.outputs.compiler }}
      repository: ${{ steps.newest.outputs.repository }}
      patch: ${{ steps.hand.outputs.patch }}
      body: ${{ steps.hand.outputs.body }}
    env:
      PINS: ${{ inputs.workflow-pins }}
      CHECK_WORKFLOW: ${{ inputs.check-workflow }}
      PACKAGE_REPOSITORY: ${{ inputs.package-repository }}
      COMPILER_REPOSITORY: ${{ inputs.compiler-repository }}
      BASE: ${{ inputs.base }}
      BRANCH_PREFIX: ${{ inputs.branch-prefix }}
      WORKFLOWS_DIRECTORY: ${{ inputs.workflows-directory }}
      PUBLISH: ${{ inputs.publish }}
      HAS_RELOCK_TOKEN: ${{ secrets.RELOCK_TOKEN != '' }}
    steps:
      # The repository's default token reads it (a private one too); this job
      # makes no authenticated call and never sees RELOCK_TOKEN's value
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false

      # The compiler and the package repository are relocked against their
      # newest main, so their commits are looked up here and handed to
      # bats's setup action as its pins. The setup action builds
      # bats-lang/bats and clones bats-lang/repository-prototype only: say
      # so rather than build another compiler than the one named.
      - name: Find the newest compiler and package repository
        id: newest
        run: |
          set -eu
          [ "$COMPILER_REPOSITORY" = bats-lang/bats ] \
            || { echo "::error::compiler-repository is $COMPILER_REPOSITORY: bats's setup action builds bats-lang/bats only"; exit 1; }
          [ "$PACKAGE_REPOSITORY" = bats-lang/repository-prototype ] \
            || { echo "::error::package-repository is $PACKAGE_REPOSITORY: bats's setup action clones bats-lang/repository-prototype only"; exit 1; }
          compiler=$(git ls-remote "https://github.com/$COMPILER_REPOSITORY.git" HEAD | cut -f1)
          repository=$(git ls-remote "https://github.com/$PACKAGE_REPOSITORY.git" HEAD | cut -f1)
          for sha in "$compiler" "$repository"; do
            case $sha in
              *[!0-9a-f]*|'') echo "::error::no commit found for a newest HEAD (got '$sha')"; exit 1 ;;
            esac
            [ ${#sha} -eq 40 ] || { echo "::error::not a full commit SHA: '$sha'"; exit 1; }
          done
          {
            echo "compiler=$compiler"
            echo "repository=$repository"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # What every bats job does first (bats-lang/bats .github/actions/setup,
      # called by commit): the compiler built from the checked-in bootstrap C
      # of the commit named, ATS2 installed by bats itself (`bats ats2
      # install`, its tarball from a fixed commit, its SHA-256 checked before
      # it is unpacked), the package repository cloned at its commit into
      # ~/repository (BATS_REPOSITORY). The caller's own pin files are not
      # read: the newest commits are given. The caller may have no bats.lock.
      - name: Set up bats at its newest
        uses: bats-lang/bats/.github/actions/setup@67ebbf0c4744edce26584eef60ea26438945bab7 # bats main
        with:
          bats-version: ${{ steps.newest.outputs.compiler }}
          repository-version: ${{ steps.newest.outputs.repository }}
          commit: ${{ steps.newest.outputs.head }}
          require-lock: 'false'

      - name: Relock and move the pins
        env:
          COMPILER_NEWEST: ${{ steps.newest.outputs.compiler }}
          REPOSITORY_NEWEST: ${{ steps.newest.outputs.repository }}
        run: |
          set -eu
          mkdir -p ~/relock
          # What was pinned, for the pull request's lists
          if [ -f bats.lock ]; then cp bats.lock ~/relock/old.lock; else : > ~/relock/old.lock; fi
          compiler_old=$(tr -d '[:space:]' < .github/bats-version 2>/dev/null || true)
          compiler_new=$COMPILER_NEWEST
          repository_new=$REPOSITORY_NEWEST
          repository_old=$(tr -d '[:space:]' < .github/repository-version 2>/dev/null || true)
          # A package with no dependencies has no lock, and gets none
          if [ -f bats.lock ]; then bats lock --repository "$BATS_REPOSITORY"; fi
          if [ -f .github/bats-version ]; then printf '%s\n' "$compiler_new" > .github/bats-version; fi
          if [ -f .github/repository-version ]; then printf '%s\n' "$repository_new" > .github/repository-version; fi

          # Each workflow pin, to its repository's newest main commit, with
          # the comment `# <repo> main <7 hex>` that bats check-pins requires
          # (#395, area: relock comment). Line-oriented rewriting of `uses:`
          # lines (as the sed it replaced did): the pin is found as text with
          # index(), the text around it is matched with patterns, and every
          # spelling not recognised is refused (the step fails naming the file,
          # the line number and the line, and nothing is written back). It
          # decides nothing about pass or fail. relock-pins-test.yml runs this
          # very awk program (between the pin-rewrite markers) on fixtures.
          case "$WORKFLOWS_DIRECTORY" in
            ''|-*|*[!A-Za-z0-9._/-]*) echo "::error::workflows-directory is refused: $WORKFLOWS_DIRECTORY"; exit 1 ;;
          esac
          : > ~/relock/pins
          for pin in $PINS; do
            owner_repo=$(printf '%s' "$pin" | cut -d/ -f1-2)
            newest=$(git ls-remote "https://github.com/$owner_repo.git" refs/heads/main | cut -f1)
            test -n "$newest" || { echo "::error::no main in $owner_repo"; exit 1; }
            old=$(grep -rhF -- "$pin@" "$WORKFLOWS_DIRECTORY" | awk -v pin="$pin@" '{ i = index($0, pin); if (i) { t = substr($0, i + length(pin)); sub(/[ \t].*/, "", t); print t; exit } }')
            test -n "$old" || { echo "::error::no workflow in $WORKFLOWS_DIRECTORY calls $pin"; exit 1; }
            comment="${owner_repo#*/} main $(printf '%.7s' "$newest")"
            grep -rlF -- "$pin@" "$WORKFLOWS_DIRECTORY" > ~/relock/pin-files
            while IFS= read -r file; do
              awk -v pin="$pin@" -v newest="$newest" -v comment="$comment" -v file="$file" '
                # pin-rewrite begin
                {
                  i = index($0, pin)
                  if (!i) { print; next }
                  before = substr($0, 1, i - 1)
                  tail = substr($0, i + length(pin))
                  match(tail, /^[A-Za-z0-9._-]*/)
                  rest = substr(tail, RLENGTH + 1)
                  if (before !~ /^[ \t]*(-[ \t]+)?uses:[ \t]+$/ || rest !~ /^[ \t]*(#.*)?$/) {
                    print "::error file=" file ",line=" NR "::refused, not a plain uses line of the pin: " $0
                    exit 1
                  }
                  print before pin newest " # " comment
                }
                # pin-rewrite end
              ' "$file" > ~/relock/pin-file.new || exit 1
              cat ~/relock/pin-file.new > "$file"
            done < ~/relock/pin-files
            if [ "$old" != "$newest" ]; then
              printf '%s %s %s %s\n' "$pin" "$owner_repo" "$old" "$newest" >> ~/relock/pins
            fi
          done

          # The workflow pins stay where they are when GITHUB_TOKEN would
          # have to change workflow files, which it cannot (a run that
          # publishes nothing has no push to refuse)
          : > ~/relock/pins-left
          if [ "$HAS_RELOCK_TOKEN" != true ] && [ "$PUBLISH" = true ]; then
            git checkout -- "$WORKFLOWS_DIRECTORY"
            mv ~/relock/pins ~/relock/pins-left
            : > ~/relock/pins
            while read -r pin owner_repo old new; do
              echo "::warning::$pin is pinned at $old; its newest is $new. GITHUB_TOKEN cannot change workflow files: move it in a pull request, or give this workflow a RELOCK_TOKEN secret."
            done < ~/relock/pins-left
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to relock: every pin is the newest." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=no" > ~/relock/state
            exit 0
          fi
          echo "changed=yes" > ~/relock/state

          # The pull request's text: each version that moved
          {
            echo "The daily relock (bats-lang/repository-prototype#269): the packages relocked against the newest \`$PACKAGE_REPOSITORY\`, and the CI pins moved to their newest."
            echo
            echo "### Packages (\`bats.lock\`)"
            echo
            awk 'NR == FNR { old[$1] = $2; next } { new[$1] = $2 }
              END {
                for (p in new) if (!(p in old)) print p, "(none)", new[p]
                for (p in new) if ((p in old) && old[p] != new[p]) print p, old[p], new[p]
                for (p in old) if (!(p in new)) print p, old[p], "(none)"
              }' ~/relock/old.lock bats.lock | sort > ~/relock/packages
            if [ -s ~/relock/packages ]; then
              echo "| Package | Old | New |"
              echo "|---|---|---|"
              while read -r name old new; do echo "| \`$name\` | $old | $new |"; done < ~/relock/packages
            else
              echo "No package moved."
            fi
            if [ -f .github/bats-version ]; then
              echo
              echo "### Compiler (\`.github/bats-version\`)"
              echo
              if [ "$compiler_old" = "$compiler_new" ]; then
                echo "Unchanged: \`$compiler_new\`."
              else
                echo "\`${compiler_old:-(none)}\` → \`$compiler_new\` ([changes](https://github.com/$COMPILER_REPOSITORY/compare/$compiler_old...$compiler_new))"
              fi
            fi
            if [ -f .github/repository-version ]; then
              echo
              echo "### Package repository (\`.github/repository-version\`)"
              echo
              if [ "$repository_old" = "$repository_new" ]; then
                echo "Unchanged: \`$repository_new\`."
              else
                echo "\`${repository_old:-(none)}\` → \`$repository_new\` ([changes](https://github.com/$PACKAGE_REPOSITORY/compare/$repository_old...$repository_new))"
              fi
            fi
            if [ -s ~/relock/pins ] || [ -s ~/relock/pins-left ]; then
              echo
              echo "### Workflows"
              echo
              while read -r pin owner_repo old new; do
                echo "- \`$pin\`: \`$old\` → \`$new\` ([changes](https://github.com/$owner_repo/compare/$old...$new))"
              done < ~/relock/pins
              while read -r pin owner_repo old new; do
                echo "- \`$pin\` **not moved**: its newest is \`$new\` (now \`$old\`, [changes](https://github.com/$owner_repo/compare/$old...$new)). GITHUB_TOKEN cannot change files in \`.github/workflows\`: move it in a pull request, or give this workflow a \`RELOCK_TOKEN\` secret that can."
              done < ~/relock/pins-left
            fi
            echo
            echo "If a check here fails, a newer version broke this project: fix it on this branch (or in a pull request of its own that commits the pins), and main stays green meanwhile."
          } > ~/relock/body.md
          cat ~/relock/body.md >> "$GITHUB_STEP_SUMMARY"

      # What job 2 and job 3 take from this one: the change as a patch (the
      # pins, the lock and any workflow pin this job moved) and the pull
      # request's text, as job outputs, which no later job can alter
      - name: Hand the change on
        id: hand
        run: |
          set -eu
          state=$(sed 's/^changed=//' ~/relock/state)
          echo "changed=$state" >> "$GITHUB_OUTPUT"
          [ "$state" = yes ] || exit 0
          # the day's branch, decided once here and passed on
          case "$BRANCH_PREFIX" in
            ''|-*|*[!A-Za-z0-9._/-]*) echo "::error::branch-prefix is refused: $BRANCH_PREFIX"; exit 1 ;;
          esac
          date=$(date -u +%Y-%m-%d)
          { echo "date=$date"; echo "branch=$BRANCH_PREFIX$date"; } >> "$GITHUB_OUTPUT"
          git add -A .github "$WORKFLOWS_DIRECTORY"
          if [ -f bats.lock ]; then git add bats.lock; fi
          patch=$(git diff --cached --binary | gzip -9n | base64 -w0)
          body=$(base64 -w0 ~/relock/body.md)
          # an environment variable of a later step is limited to 128 KiB
          [ ${#patch} -lt 100000 ] && [ ${#body} -lt 20000 ] \
            || { echo "::error::the relock's change is larger than the jobs hand on (patch ${#patch}, text ${#body})"; exit 1; }
          { echo "patch=$patch"; echo "body=$body"; } >> "$GITHUB_OUTPUT"

  # Job 2: the caller's command, with nothing to steal and nothing later
  # that trusts it (see the header)
  regenerate:
    needs: relock
    if: inputs.regenerate != '' && needs.relock.outputs.changed == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.regenerate-timeout-minutes) }}
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.relock.outputs.head }}
          persist-credentials: false

      - name: Set up bats at its newest
        uses: bats-lang/bats/.github/actions/setup@67ebbf0c4744edce26584eef60ea26438945bab7 # bats main
        with:
          bats-version: ${{ needs.relock.outputs.compiler }}
          repository-version: ${{ needs.relock.outputs.repository }}
          commit: ${{ needs.relock.outputs.head }}
          require-lock: 'false'

      - name: Apply the relock, run the command and pack the listed paths
        env:
          PATCH: ${{ needs.relock.outputs.patch }}
          REGENERATE: ${{ inputs.regenerate }}
          REGENERATE_PATHS: ${{ inputs.regenerate-paths }}
          MAX_BYTES: ${{ inputs.regenerate-max-bytes }}
        run: |
          set -eu
          [ -n "$REGENERATE_PATHS" ] \
            || { echo "::error::regenerate is given without regenerate-paths: nothing would be committed"; exit 1; }
          # the path rule, as job 3's Python states it (see the header)
          refused() {
            case "$1" in
              ''|-*|/*|*/|*//*|*[!A-Za-z0-9._/@+=,-]*) return 0 ;;
            esac
            lower=$(printf '%s' "$1" | tr 'A-Z' 'a-z')
            case "/$lower/" in
              */./*|*/../*|*/.git/*|*/.github/*|*/.gitmodules/*|*/.gitattributes/*) return 0 ;;
            esac
            return 1
          }
          printf '%s\n' "$REGENERATE_PATHS" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            if refused "$path"; then
              echo "::error::regenerate-paths names a path that is refused: $path"; exit 1
            fi
          done
          printf '%s' "$PATCH" | base64 -d | gunzip | git apply --binary
          sh -eu -c "$REGENERATE"
          printf '%s\n' "$REGENERATE_PATHS" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ -e "$path" ] || { echo "::error::the command did not write $path"; exit 1; }
            if [ -n "$(find "$path" ! -type f ! -type d -print -quit)" ] || [ -L "$path" ]; then
              echo "::error::$path holds something that is not a regular file or a directory: $(find "$path" ! -type f ! -type d -print -quit)"; exit 1
            fi
          done
          printf '%s\n' "$REGENERATE_PATHS" | grep -v '^$' \
            | tar --verbatim-files-from -cf "$RUNNER_TEMP/regenerated.tar" -T -
          size=$(stat -c %s "$RUNNER_TEMP/regenerated.tar")
          [ "$size" -le "$MAX_BYTES" ] \
            || { echo "::error::the regenerated files are $size bytes, over regenerate-max-bytes ($MAX_BYTES)"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated
          path: ${{ runner.temp }}/regenerated.tar
          retention-days: 1
          if-no-files-found: error

  # Job 3: the privileged half, from clean inputs only
  publish:
    needs: [relock, regenerate]
    if: >-
      always() && needs.relock.result == 'success'
      && needs.relock.outputs.changed == 'yes'
      && inputs.publish == 'true'
      && (needs.regenerate.result == 'success' || needs.regenerate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: ${{ needs.relock.outputs.branch }}
      DATE: ${{ needs.relock.outputs.date }}
      BRANCH_PREFIX: ${{ inputs.branch-prefix }}
      CHECK_WORKFLOW: ${{ inputs.check-workflow }}
      BASE: ${{ inputs.base }}
      REGENERATE_PATHS: ${{ inputs.regenerate-paths }}
      MAX_BYTES: ${{ inputs.regenerate-max-bytes }}
      PATCH: ${{ needs.relock.outputs.patch }}
      BODY: ${{ needs.relock.outputs.body }}
      HAS_RELOCK_TOKEN: ${{ secrets.RELOCK_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.RELOCK_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.relock.outputs.head }}
          token: ${{ secrets.RELOCK_TOKEN || github.token }}
          persist-credentials: false

      - name: Apply the relock
        run: |
          set -eu
          printf '%s' "$PATCH" | base64 -d | gunzip | git apply --binary --index
          mkdir -p ~/relock
          printf '%s' "$BODY" | base64 -d > ~/relock/body.md

      - name: Download what the command wrote
        if: needs.regenerate.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regenerated
          path: ${{ runner.temp }}/regenerated

      # The artifact is data from a job that ran the newest packages' code.
      # Nothing is extracted by tar: each member is checked and its bytes are
      # written by this script, as a regular file under a listed path.
      - name: Take the listed files, as data
        if: needs.regenerate.result == 'success'
        run: |
          python3 -I - "$RUNNER_TEMP/regenerated/regenerated.tar" <<'PY'
          import os, re, shutil, sys, tarfile
          paths = [p for p in os.environ['REGENERATE_PATHS'].split('\n') if p]
          cap = int(os.environ['MAX_BYTES'])
          allowed = re.compile(r'^[A-Za-z0-9._/@+=,-]+$')
          def refused(name):
              # the path rule of the header, as job 2's shell states it
              if (not allowed.fullmatch(name) or name.startswith('/')
                      or name.startswith('-') or name.endswith('/')):
                  return True
              for part in name.split('/'):
                  if part in ('', '.', '..') or part.lower() in ('.git', '.github', '.gitmodules', '.gitattributes'):
                      return True
              return False
          def die(message):
              print('::error::' + message)
              sys.exit(1)
          if not paths:
              die('regenerate-paths is empty')
          for path in paths:
              if refused(path):
                  die('regenerate-paths names a path that is refused: %r' % path)
          directories, files, total = [], [], 0
          with tarfile.open(sys.argv[1], 'r:') as archive:
              members = archive.getmembers()
              if len(members) > 100000:
                  die('too many members in the regenerated files')
              for member in members:
                  name = member.name
                  if refused(name) or not any(name == p or name.startswith(p + '/') for p in paths):
                      die('a member outside the listed paths or with a refused name: %r' % name)
                  if member.isdir():
                      directories.append(name)
                  elif member.isreg():
                      total += member.size
                      if total > cap:
                          die('the regenerated files are over regenerate-max-bytes (%d)' % cap)
                      files.append(member)
                  else:
                      die('a member that is not a regular file or a directory: %r' % name)
              for path in paths:
                  if not any(m.name == path for m in members):
                      die('the regenerated files do not hold %s' % path)
                  walked = ''
                  for part in path.split('/')[:-1]:
                      walked = os.path.join(walked, part)
                      if os.path.islink(walked):
                          die('%s is a link in the checkout' % walked)
                  if os.path.islink(path) or os.path.isfile(path):
                      os.remove(path)
                  elif os.path.isdir(path):
                      shutil.rmtree(path)
              for name in directories:
                  os.makedirs(name, exist_ok=True)
              for member in files:
                  os.makedirs(os.path.dirname(member.name) or '.', exist_ok=True)
                  data = archive.extractfile(member).read()
                  mode = 0o755 if member.mode & 0o100 else 0o644
                  descriptor = os.open(member.name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)
                  with os.fdopen(descriptor, 'wb') as out:
                      out.write(data)
                  os.chmod(member.name, mode)
          print('took %d files (%d bytes) under %s' % (len(files), total, ', '.join(paths)))
          PY

      - name: Push the branch, open the pull request and dispatch the check
        run: |
          set -eu
          branch="$BRANCH"
          repo="$GITHUB_REPOSITORY"
          git checkout -q -B "$branch"
          git add -A .github
          if [ -f bats.lock ]; then git add bats.lock; fi
          # one path per line, never split or expanded
          printf '%s\n' "$REGENERATE_PATHS" | while IFS= read -r path; do
            [ -z "$path" ] || git add -A -- ":(literal)$path"
          done
          title="Relock packages and CI pins ($DATE)"
          { echo "$title"; echo; cat ~/relock/body.md; } > ~/relock/message
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F ~/relock/message
          # The checkout keeps no credentials: git gets the token here, as
          # actions/checkout would have written it
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git_auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"
          git -c "$git_auth" push --force origin "$branch"

          number=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number // empty')
          opened=yes
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$repo" --title "$title" --body-file ~/relock/body.md
          elif gh pr create --repo "$repo" --base "$BASE" --head "$branch" \
              --title "$title" --body-file ~/relock/body.md > ~/relock/pr.out 2> ~/relock/pr.err; then
            number=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number')
          else
            cat ~/relock/pr.err
            opened=no
          fi

          # The check runs on the branch's commit either way, so its result
          # shows on the pull request. A token other than GITHUB_TOKEN
          # starts the pull request's checks by itself.
          if [ "$HAS_RELOCK_TOKEN" != true ]; then
            gh workflow run "$CHECK_WORKFLOW" --repo "$repo" --ref "$branch"
          fi

          issue_title='Allow GitHub Actions to create pull requests, for the daily relock'
          issue=$(gh issue list --repo "$repo" --state open --search "\"$issue_title\" in:title" --json number --jq '.[0].number // empty')

          if [ "$opened" = yes ]; then
            # An older relock is superseded by this one
            gh pr list --repo "$repo" --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r older; do
              gh pr close "$older" --repo "$repo" --delete-branch --comment "Superseded by #$number."
            done
            # The setting is on now: the issue that asked for it is done
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$repo" --comment "The relock opened #$number: GitHub Actions may create pull requests now."
            fi
            echo "Relock pull request: #$number" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! grep -qi "not permitted to create or approve pull requests" ~/relock/pr.err; then
            echo "::error::Could not open the relock pull request for $branch (see the output above)."
            exit 1
          fi

          # Without a pull request, only the newest relock branch is kept: an
          # older one is superseded, as its pull request would be (unless
          # someone opened a pull request from it by hand)
          git -c "$git_auth" ls-remote --heads origin "$BRANCH_PREFIX*" | sed 's|.*refs/heads/||' | while read -r older; do
            [ "$older" != "$branch" ] || continue
            if [ -z "$(gh pr list --repo "$repo" --head "$older" --state open --json number --jq '.[0].number // empty')" ]; then
              git -c "$git_auth" push -q origin --delete "$older" || true
            fi
          done

          # One "human only" issue says how to turn the setting on, and
          # always names the newest branch; it is closed by the first run
          # that opens its pull request once the setting is on
          cat > ~/relock/issue.md <<ISSUE
          The daily relock (\`.github/workflows/relock.yml\`, bats-lang/repository-prototype#269) pushes its branch and starts \`$CHECK_WORKFLOW\` on it, but cannot open the pull request: GitHub Actions may not create pull requests here. Only an administrator can change that.

          **The newest relock:** branch [\`$branch\`]($GITHUB_SERVER_URL/$repo/compare/$BASE...$branch) (a pull request can be opened from it by hand meanwhile), its [\`$CHECK_WORKFLOW\` runs]($GITHUB_SERVER_URL/$repo/actions/workflows/$CHECK_WORKFLOW?query=branch%3A$branch), and the [relock run]($GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID).

          To turn the setting on:
          1. An organization owner opens https://github.com/organizations/${repo%%/*}/settings/actions, scrolls to **Workflow permissions**, ticks **Allow GitHub Actions to create and approve pull requests** and clicks **Save**. That lets every repository of the organization turn it on.
          2. Open https://github.com/$repo/settings/actions (**Settings**, then **Actions** → **General**), tick the same box under **Workflow permissions**, and click **Save**.
          3. Run the relock again: https://github.com/$repo/actions/workflows/relock.yml → **Run workflow**. It opens the pull request and closes this issue.
          ISSUE
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$repo" --body-file ~/relock/issue.md
          else
            gh label create "human only" --repo "$repo" --color B60205 --description "Needs a person: a setting, a secret or a decision" 2>/dev/null || true
            gh issue create --repo "$repo" --title "$issue_title" --label "human only" --body-file ~/relock/issue.md
          fi
          echo "::warning::Could not open the relock pull request: GitHub Actions may not create pull requests here. $branch is pushed and $CHECK_WORKFLOW dispatched on it; a \"human only\" issue names the branch and says how to turn the setting on."
