# Relocks a bats project and moves its CI pins to their newest, as a pull
# request that its check workflow runs on (#269, from bats-lang/quire#203).
# Every package (and the compiler, and apps such as quire) calls it, by
# commit, from a small daily relock.yml:
#
#   name: relock
#   on:
#     schedule:
#       - cron: '17 5 * * *'
#     workflow_dispatch:
#   permissions:
#     contents: write        # push relock/<date>
#     pull-requests: write   # open its pull request
#     actions: write         # dispatch the check workflow on it
#     issues: write          # say when a setting stops the pull request
#   jobs:
#     relock:
#       uses: bats-lang/repository-prototype/.github/workflows/relock-pins.yml@<commit>
#       secrets: inherit
#       with:
#         workflow-pins: |
#           bats-lang/repository-prototype/.github/workflows/publish.yml
#           bats-lang/repository-prototype/.github/workflows/relock-pins.yml
#
# A caller that commits something derived from its lock or pins (bats's
# bootstrap/c, the C of the compiler it compiles from its locked packages,
# bats-lang/bats#299) gives `regenerate`, a shell command run in its checkout
# after the pins moved and only when something did, with the newest bats on
# PATH and BATS_REPOSITORY set, and `regenerate-paths`, the files and
# directories it writes, one per line, which are committed with the pins.
# Both default to off, and then the run is the same relock as before.
#
# The command runs the code of the newest published packages (it builds them
# and runs the result), while the relock holds RELOCK_TOKEN, which can push and
# change workflow files. So privilege is separated by job, not guarded by a
# list of what the command must not touch:
#
#  1. relock: finds the newest, relocks, moves the pins, decides the branch
#     name (once, so a run that crosses midnight is one date) and hands the
#     change on as job outputs (a patch and the pull request's text). It
#     never runs the caller's command, and it has no token of its own (only
#     the repository's default GITHUB_TOKEN to check out, and whether a
#     RELOCK_TOKEN exists).
#  2. regenerate (permissions: {}, no secrets, a checkout with no
#     credentials, a timeout): applies the patch, runs the command, and
#     uploads one tar of the listed paths. It is a different runner from job
#     3, so whatever the command writes (GITHUB_ENV, GITHUB_PATH, .git/hooks,
#     the runner's tools, ~/relock) is gone with it.
#  3. publish (the only job with RELOCK_TOKEN): in its own clean checkout
#     applies the same patch, takes the tar as data only (the path rule
#     below; every member must be a regular file or directory under a listed
#     path, a size cap; the files are written by this job's own code, never
#     extracted by tar), commits, pushes and opens the pull request. The
#     command's only influence on it is the bytes of the listed regular files.
#
# What happens when the command goes wrong: if it fails (job 2 fails), or
# writes a link or anything else that is not a regular file or a directory,
# or too much, or a path outside the listed ones, or job 3 refuses its tar,
# the run is red and NOTHING is pushed: an existing relock branch of the day
# (a good one from an earlier run) is never replaced by one without the
# files, and the pins are not pushed without them either.
#
# The path rule, the same text in job 2's shell and job 3's Python, tested
# with the same cases: a path is refused when it is empty, starts with `/` or
# `-`, ends with `/`, has an empty, `.` or `..` component, has a character
# other than letters, digits and `._/@+=,-` (a newline included), or has a
# component that is, in any case, `.git`, `.github`, `.gitmodules` or
# `.gitattributes`, at any depth.
#
# Limits, a change from before regenerate existed: the change handed on
# (the patch, gzipped and base64) is under 800000 characters, in pieces of
# 100000, and the pull request's text under 20000, because a job output goes
# to a step as an environment variable (128 KiB); a relock larger than that
# fails with a message. The regenerated files are at most `regenerate-max-bytes`.
#
# Concurrency: the group is `relock-pins-<repository>-<branch-prefix>` (never
# cancelled), so one relock per repository and prefix runs at a time and a
# scheduled run and a dispatch with the same prefix cannot interleave their
# pushes. `branch-prefix` (default `relock/`) names the branch and the pull
# requests this run supersedes: a test run uses another prefix, so it runs
# beside, and cannot touch, the day's real relock.
#
# Do not give `regenerate` to a repository that is not public (job 2 has no
# permissions, so it cannot check out a private one), nor to one whose
# workflows use actions/cache or other state that a later run trusts: the
# command's job can write the cache for the caller's ref through the runner's
# cache token, which no permission setting takes away.
#
# The action pins (#414, area: repin actions, piece 5 of 7 of #392): every
# third-party `uses: <owner>/<repo>[/<path>]@<40 hex> # <version tag>` line of
# the workflows directory is moved by tools/repin's `actions` command (built
# from the package repository the setup step cloned) to the highest version of
# its major that is a release at least 7 days old, with that tag as the
# comment. The releases file it reads is written from `gh api` (the releases
# of each action the workflows use, no draft and no prerelease) and
# `git ls-remote --tags` (the commit each tag points to, an annotated tag
# dereferenced to its commit); the time is the clock's. The move records (kind,
# name, old, new, release age, status) are the section `### Actions` of the
# pull request body, rendered by `repin table`; a pin not moved because of a
# newer major or a release under 7 days is listed with that status. Without a
# RELOCK_TOKEN a workflow file cannot be changed, so a move that would be made
# is listed as `not moved` with the reason, as a workflow pin is. A run where
# no action pin moves is the relock it was. `actions-releases` and
# `actions-now` replace the two sources (a file of the checkout, a time) for a
# test; both default to off. The awk programs between the `tag-commit`,
# `actions-left` and `actions-bullet` markers (a tag's commit, the records
# split for the no-token case, the list of moves not made) are run on
# fixtures by relock-pins-test.yml.
#
# A caller whose pins are not `uses:` lines (an Android SDK revision, a ref
# in a file of its own) gives `repin-command` (#420, piece 2 of 3 of
# bats-lang/pwa#173; area: repin command), a shell command run in its checkout
# BEFORE the relock decides whether anything changed, and `repin-paths`, the
# files and directories it may rewrite, one per line. It appends move records
# (the tools/repin format: kind, name, old, new, age, status, tab separated,
# one line for each pin examined, a kind word of its own) to the file named by
# the environment variable REPIN_RECORDS. Both default to off, and then the
# run is the same relock as before. What follows from it:
#
#  - job `repin` (permissions: {}, no secrets, no credentials, a timeout) runs
#    the command on the base, with the newest bats on PATH, and refuses the
#    run (red, nothing pushed) when it fails, when it wrote anything outside
#    repin-paths (a tracked file changed, an untracked or ignored file made,
#    compared with the checkout before it ran), or when a listed path is gone
#    or holds a link or anything that is not a regular file or a directory.
#    It uploads one tar of the listed paths and the records file.
#  - job `relock` takes the tar as data (nothing is extracted by tar: each
#    member is checked and written by this job's own code, the path rule
#    below), before the pins move, so the files count in "anything changed?"
#    and travel in the patch with the pins, and renders the records with
#    tools/repin's `table` (built from the package repository the setup step
#    cloned): a line that is not a record fails the run. The table is the
#    section "Moved by the repin command" of the pull request body.
#  - a run where the command moved no file and no pin moved opens no pull
#    request and says so in the step summary. A failed `repin` job skips
#    `relock` and `publish`, so nothing is pushed.
#
# The command has no RELOCK_TOKEN: like `regenerate`, it runs the code of
# packages that are not this repository's, in a job that is a different runner
# from the one that pushes. The `# repin-check` markers below delimit the
# script relock-pins-test.yml runs on fixtures (a write outside the paths, a
# link, a failing command, a path the rule refuses).
#
# The npm dependencies (#415, area: repin npm, piece 6 of 7 of #392): each
# directory holding a `package.json` and a `pnpm-lock.yaml` (found with `find`,
# `node_modules` and `.git` left out, `npm-ignore` directories left out) is
# moved within the ranges of its dependencies, never to a new major. The
# repository's pinned pnpm (`packageManager`, run through Node's corepack,
# Node by `.nvmrc`, or the file `npm-node-version-file` names, when the
# checkout has one) lists the projects of the directory (`pnpm -r ls`, so a
# workspace's members are the ones pnpm names, no lock is read here), and for each project runs `pnpm outdated --format
# json` and its `--compatible` form, writes the registry publish time of each
# version of the major(s) in play (`pnpm view <name> time --json`) and runs
# tools/repin's `npm` command (#412) at the clock's time, which prints the move
# records and writes the `name@version` lines of the moves; `pnpm update
# --lockfile-only --ignore-scripts` on exactly those lines regenerates the lock
# (no `--latest`, so a major is never taken; no install, so no script of the
# repository or of a package runs). The moved `package.json` and
# `pnpm-lock.yaml` are in the relock patch, the records are the section
# `### npm` of the pull request body (a newer major is `major, not moved`), and
# a repository with no `pnpm-lock.yaml` is untouched. A directory whose
# package.json has no `packageManager` of pnpm fails the run. `npm-now` (whole
# seconds) replaces the clock for a test and `npm-ignore` (directories, one
# per line) leaves fixtures out; both default to off. The step runs in the
# `relock` job, which has no RELOCK_TOKEN: a lock needs none.
#
# The Gradle wrapper (#416, area: repin gradle, piece 7 of 7 of #392): each
# `gradle/wrapper/gradle-wrapper.properties` (found with `find`, `node_modules`
# and `.git` left out, `gradle-ignore` directories left out) is moved to the
# newest stable release of its major that is at least 7 days old, never to a new
# major. The step fetches `https://services.gradle.org/versions/all` once (as
# compact JSON), runs tools/repin's `gradle` command (#413) at the clock's time
# with a placeholder checksum to learn the target, fetches the target's own
# `.sha256` (`gradle-<version>-bin.zip.sha256`), runs the command again with it
# (repin refuses anything but 64 lowercase hex digits) and then Gradle itself
# writes the files: `./gradlew wrapper --gradle-version <version>
# --gradle-distribution-sha256-sum <sha256>`, twice (the first run is the old
# wrapper's and writes the properties; the second is the new Gradle's and
# writes the scripts and the jar), under the JDK of the repository's
# `.java-version` (the file `gradle-java-version-file` names, when the checkout
# has it). The properties are then required to hold exactly the target's url and
# the published checksum, as lines. The wrapper's files (properties, jar,
# `gradlew`, `gradlew.bat`, tracked ones only) are in the relock patch and the
# records are the section `### Gradle` of the pull request body (a newer major
# is `major, not moved`); the relock pull request is dispatched to the
# repository's check workflow as always, so its whole CI runs on the result. A
# repository with no wrapper is untouched. `gradle-now` (whole seconds)
# replaces the clock for a test and `gradle-ignore` (directories, one per line)
# leaves fixtures out; both default to off.
#
# The patch can be larger than one output: a wrapper's jar alone is about 100000
# characters once gzipped and base64 (the diff holds it in both directions).
# So the patch travels in up to 8 pieces of 100000 characters, the first as
# `patch` (the whole patch when it is under 100000, as before) and the others as
# `patch-part-2` to `patch-part-8`; a change over 800000 characters fails with a
# message, as one over the old limit did.
#
# The caller's pins, each moved only when the caller has it:
#
# - bats.lock: the packages, relocked against the newest package
#   repository (a package with no dependencies has none);
# - .github/bats-version: the compiler's commit, moved to its newest main;
# - .github/repository-version: the package repository's commit that CI
#   fetches, so what a test package locks (bats lock --dev in tests/) is
#   pinned too, moved to the commit relocked against;
# - each reusable workflow named in workflow-pins, called from
#   .github/workflows as <owner>/<repo>/<path>@<commit>, moved to its
#   repository's newest main commit. The line is written
#   `uses: <pin>@<commit> # <repo> main <first 7 hex of the commit>` (the
#   <repo> of <owner>/<repo>), replacing any comment the line had, so a line
#   never carries two: `bats check-pins` fails a commit with no comment saying
#   which version it is, and one form serves every repository (#395). It is
#   written for every pin line, moved or not, so a line left with another
#   comment is healed by the next relock. A line holding the pin that is not
#   `uses: <pin>@<token>` followed by nothing or a `#` comment (a quoted value,
#   flow style, a commented-out line, text after the token) fails the step.
#
# Every input of this file is pinned (#332): actions/checkout by commit, and
# the compiler, ATS2 and the package repository by bats's setup action
# (bats-lang/bats .github/actions/setup, by commit; its `bats ats2 install`
# checks the ATS2 tarball's SHA-256). Move that commit in a pull request of
# its own, with the commit of the newest bats that has the action.
#
# A run builds the compiler at its newest main, moves the pins, and when
# anything changed pushes relock/<date>, opens a pull request listing each
# old and new version (closing older relock pull requests), and dispatches
# the check workflow on that branch: a pull request opened with
# GITHUB_TOKEN starts no workflow, and workflow_dispatch is the
# documented exception. A breaking publish then shows as a red relock
# pull request, and main stays green.
#
# GITHUB_TOKEN cannot change files in .github/workflows. With a
# RELOCK_TOKEN secret (a fine-grained token on the repository with
# Contents, Pull requests and Workflows read and write) the workflow pins
# move too, and its pull request starts the checks itself; without one, a
# workflow pin that would move is listed in the pull request instead.
#
# Opening the pull request with GITHUB_TOKEN needs the setting "Allow
# GitHub Actions to create and approve pull requests" (the organization's,
# then the repository's). While it is off, a run still pushes the branch
# (deleting older relock branches) and dispatches the check, and keeps one
# "human only" issue that names the newest branch and says how to turn
# the setting on; the first run that opens its pull request closes it.
name: relock-pins

on:
  workflow_call:
    inputs:
      workflow-pins:
        description: Reusable workflows the caller pins by commit, <owner>/<repo>/<path> one per line
        type: string
        default: ''
      pin-copies:
        description: >-
          Inputs of a caller that repeat a workflow pin's commit (a reusable
          workflow cannot read its own ref), `<owner>/<repo>/<path> <input>`
          one per line: every `<input>: <40 hex>` line of the files that
          call the pin moves to the commit the pin moves to (#385)
        type: string
        default: ''
      check-workflow:
        description: The workflow dispatched on the relock branch
        type: string
        default: check.yml
      package-repository:
        description: The package repository bats lock resolves against
        type: string
        default: bats-lang/repository-prototype
      compiler-repository:
        description: The bats compiler's repository, whose main .github/bats-version moves to
        type: string
        default: bats-lang/bats
      regenerate:
        description: >-
          Shell command run in the caller's checkout after the pins moved, when
          anything changed (the newest bats on PATH, BATS_REPOSITORY set), to
          regenerate files derived from the lock; empty runs nothing
        type: string
        default: ''
      regenerate-paths:
        description: >-
          Paths the regenerate command writes, one per line, committed with the
          pins (deletions included); required when regenerate is given
        type: string
        default: ''
      regenerate-max-bytes:
        description: The most bytes of the regenerated files the publish job accepts
        type: string
        default: '67108864'
      repin-command:
        description: >-
          Shell command run in the caller's checkout before the relock decides
          whether anything changed (the newest bats on PATH, BATS_REPOSITORY
          set), to move pins that are not `uses:` lines; it appends move
          records to the file named by REPIN_RECORDS and may rewrite files
          under repin-paths only; empty runs nothing (#420)
        type: string
        default: ''
      repin-paths:
        description: >-
          Paths the repin command may write, one per line, committed with the
          pins; required when repin-command is given
        type: string
        default: ''
      repin-max-bytes:
        description: The most bytes of the repinned files the relock job accepts
        type: string
        default: '67108864'
      repin-timeout-minutes:
        description: Minutes the repin command and its job may take
        type: string
        default: '60'
      actions-releases:
        description: >-
          A file of the checkout holding the releases of the actions the
          workflows use, a line `<owner>/<repo> <tag> <commit> <published
          seconds>` for each (the tools/repin format); empty fetches them
          from GitHub. A test gives a fixture's (#414)
        type: string
        default: ''
      actions-now:
        description: >-
          Whole seconds since the epoch that the release age of an action pin
          is counted at; empty reads the clock. A test gives a fixed time (#414)
        type: string
        default: ''
      npm-now:
        description: >-
          Whole seconds since the epoch that the release age of an npm
          dependency is counted at; empty reads the clock. A test gives a
          fixed time (#415)
        type: string
        default: ''
      npm-node-version-file:
        description: >-
          The file whose Node version runs the pinned pnpm (setup-node's
          node-version-file); when the checkout has no such file the runner's
          Node is used (#415)
        type: string
        default: .nvmrc
      npm-ignore:
        description: >-
          Directories (relative to the checkout, one per line, each with
          everything under it) whose pnpm-lock.yaml the relock leaves alone;
          a test's fixtures are such (#415)
        type: string
        default: ''
      gradle-now:
        description: >-
          Whole seconds since the epoch that the release age of a Gradle
          release is counted at; empty reads the clock. A test gives a fixed
          time (#416)
        type: string
        default: ''
      gradle-java-version-file:
        description: >-
          The file whose Java version runs the Gradle wrapper (setup-java's
          java-version-file); when the checkout has no such file the runner's
          Java is used (#416)
        type: string
        default: .java-version
      gradle-ignore:
        description: >-
          Directories (relative to the checkout, one per line, each with
          everything under it) whose Gradle wrapper the relock leaves alone;
          a test's fixtures are such (#416)
        type: string
        default: ''
      branch-prefix:
        description: >-
          The relock branch is <prefix><date>; older pull requests from
          branches with this prefix are superseded. A test run uses another
        type: string
        default: relock/
      regenerate-timeout-minutes:
        description: Minutes the caller's command and its job may take
        type: string
        default: '60'
      base:
        description: The branch relocked and the pull request's base
        type: string
        default: main
      workflows-directory:
        description: The directory whose files are searched for the workflow pins (a test uses a fixture's)
        type: string
        default: .github/workflows
      publish:
        description: >-
          'false' stops after the relock (and regenerate): nothing is pushed
          and no pull request is opened, and the change is the outputs. A test
          runs the relock so and reads what it would have pushed
        type: string
        default: 'true'
    outputs:
      changed:
        description: yes when a pin or the lock moved, else no
        value: ${{ jobs.relock.outputs.changed }}
      patch:
        description: The change as a patch, gzipped and base64 (empty when nothing moved); its first 100000 characters when it is longer, the rest in patch-part-2 to patch-part-8
        value: ${{ jobs.relock.outputs.patch }}
      patch-part-2:
        description: Piece 2 of the patch (the next 100000 characters; empty when the patch is shorter)
        value: ${{ jobs.relock.outputs.patch-part-2 }}
      patch-part-3:
        description: Piece 3 of the patch (the next 100000 characters; empty when the patch is shorter)
        value: ${{ jobs.relock.outputs.patch-part-3 }}
      patch-part-4:
        description: Piece 4 of the patch (the next 100000 characters; empty when the patch is shorter)
        value: ${{ jobs.relock.outputs.patch-part-4 }}
      patch-part-5:
        description: Piece 5 of the patch (the next 100000 characters; empty when the patch is shorter)
        value: ${{ jobs.relock.outputs.patch-part-5 }}
      patch-part-6:
        description: Piece 6 of the patch (the next 100000 characters; empty when the patch is shorter)
        value: ${{ jobs.relock.outputs.patch-part-6 }}
      patch-part-7:
        description: Piece 7 of the patch (the next 100000 characters; empty when the patch is shorter)
        value: ${{ jobs.relock.outputs.patch-part-7 }}
      patch-part-8:
        description: Piece 8 of the patch (the next 100000 characters; empty when the patch is shorter)
        value: ${{ jobs.relock.outputs.patch-part-8 }}
      body:
        description: The pull request's text, base64 (empty when nothing moved)
        value: ${{ jobs.relock.outputs.body }}
    secrets:
      RELOCK_TOKEN:
        required: false

concurrency:
  group: relock-pins-${{ github.repository }}-${{ inputs.branch-prefix }}
  cancel-in-progress: false

jobs:
  # Job 0 (only with repin-command): the caller's command, with nothing to
  # steal, before anything is relocked (see the header)
  repin:
    if: inputs.repin-command != ''
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.repin-timeout-minutes) }}
    permissions: {}
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false

      - name: Find the newest compiler and package repository
        id: newest
        env:
          COMPILER_REPOSITORY: ${{ inputs.compiler-repository }}
          PACKAGE_REPOSITORY: ${{ inputs.package-repository }}
        run: |
          set -eu
          [ "$COMPILER_REPOSITORY" = bats-lang/bats ] \
            || { echo "::error::compiler-repository is $COMPILER_REPOSITORY: bats's setup action builds bats-lang/bats only"; exit 1; }
          [ "$PACKAGE_REPOSITORY" = bats-lang/repository-prototype ] \
            || { echo "::error::package-repository is $PACKAGE_REPOSITORY: bats's setup action clones bats-lang/repository-prototype only"; exit 1; }
          compiler=$(git ls-remote "https://github.com/$COMPILER_REPOSITORY.git" HEAD | cut -f1)
          repository=$(git ls-remote "https://github.com/$PACKAGE_REPOSITORY.git" HEAD | cut -f1)
          for sha in "$compiler" "$repository"; do
            case $sha in
              *[!0-9a-f]*|'') echo "::error::no commit found for a newest HEAD (got '$sha')"; exit 1 ;;
            esac
            [ ${#sha} -eq 40 ] || { echo "::error::not a full commit SHA: '$sha'"; exit 1; }
          done
          {
            echo "compiler=$compiler"
            echo "repository=$repository"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up bats at its newest
        uses: bats-lang/bats/.github/actions/setup@67ebbf0c4744edce26584eef60ea26438945bab7 # bats main
        with:
          bats-version: ${{ steps.newest.outputs.compiler }}
          repository-version: ${{ steps.newest.outputs.repository }}
          commit: ${{ steps.newest.outputs.head }}
          require-lock: 'false'

      - name: Run the repin command and pack the listed paths
        env:
          REPIN_COMMAND: ${{ inputs.repin-command }}
          REPIN_PATHS: ${{ inputs.repin-paths }}
          MAX_BYTES: ${{ inputs.repin-max-bytes }}
        run: |
          # repin-check begin
          set -eu
          export LC_ALL=C
          [ -n "$REPIN_PATHS" ] \
            || { echo "::error::repin-command is given without repin-paths: nothing would be committed"; exit 1; }
          # the path rule, as relock's Python states it (see the header)
          refused() {
            case "$1" in
              ''|-*|/*|*/|*//*|*[!A-Za-z0-9._/@+=,-]*) return 0 ;;
            esac
            lower=$(printf '%s' "$1" | tr 'A-Z' 'a-z')
            case "/$lower/" in
              */./*|*/../*|*/.git/*|*/.github/*|*/.gitmodules/*|*/.gitattributes/*) return 0 ;;
            esac
            return 1
          }
          work="$RUNNER_TEMP/repin-work"
          out="$RUNNER_TEMP/repin"
          rm -rf "$work" "$out"
          mkdir -p "$work" "$out"
          printf '%s\n' "$REPIN_PATHS" > "$work/paths"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if refused "$path"; then
              echo "::error::repin-paths names a path that is refused: $path"; exit 1
            fi
          done < "$work/paths"
          # what the checkout holds before the command: changed, untracked and ignored files
          snapshot() { git status --porcelain -z --ignored --untracked-files=all | tr '\0' '\n' | sort; }
          snapshot > "$work/before"
          : > "$out/records"
          REPIN_RECORDS="$out/records" sh -eu -c "$REPIN_COMMAND"
          [ -f "$out/records" ] && [ ! -L "$out/records" ] \
            || { echo "::error::the command removed or replaced the file REPIN_RECORDS names"; exit 1; }
          # anything the command changed, made or removed must be under a listed path
          snapshot > "$work/after"
          comm -13 "$work/before" "$work/after" > "$work/changed"
          while IFS= read -r line; do
            entry=${line#???}
            inside=no
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$entry" in "$path"|"$path"/*) inside=yes ;; esac
            done < "$work/paths"
            [ "$inside" = yes ] \
              || { echo "::error::the command wrote outside repin-paths: $entry"; exit 1; }
          done < "$work/changed"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ -L "$path" ]; then
              echo "::error::$path is a link"; exit 1
            fi
            [ -e "$path" ] || { echo "::error::the command left no $path"; exit 1; }
            if [ -n "$(find "$path" ! -type f ! -type d -print -quit)" ]; then
              echo "::error::$path holds something that is not a regular file or a directory: $(find "$path" ! -type f ! -type d -print -quit)"; exit 1
            fi
          done < "$work/paths"
          grep -v '^$' "$work/paths" | tar --verbatim-files-from -cf "$out/files.tar" -T -
          size=$(stat -c %s "$out/files.tar")
          [ "$size" -le "$MAX_BYTES" ] \
            || { echo "::error::the repinned files are $size bytes, over repin-max-bytes ($MAX_BYTES)"; exit 1; }
          echo "the command wrote $(wc -l < "$work/changed") entries, all under the listed paths; $(wc -l < "$out/records") records"
          # repin-check end

      # an artifact's name is unique in a run, and a run may call this workflow
      # more than once: the branch prefix is what tells the calls apart (the
      # concurrency group is made of it)
      - name: Name the artifact
        id: artifact
        env:
          BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        run: |
          set -eu
          case "$BRANCH_PREFIX" in
            ''|-*|*[!A-Za-z0-9._/-]*) echo "::error::branch-prefix is refused: $BRANCH_PREFIX"; exit 1 ;;
          esac
          echo "name=repin-$(printf '%s' "$BRANCH_PREFIX" | tr '/' '_')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/repin
          retention-days: 1
          if-no-files-found: error

  relock:
    needs: repin
    if: >-
      always() && (needs.repin.result == 'success' || needs.repin.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      branch: ${{ steps.hand.outputs.branch }}
      date: ${{ steps.hand.outputs.date }}
      changed: ${{ steps.hand.outputs.changed }}
      head: ${{ steps.newest.outputs.head }}
      compiler: ${{ steps.newest.outputs.compiler }}
      repository: ${{ steps.newest.outputs.repository }}
      patch: ${{ steps.hand.outputs.patch }}
      patch-part-2: ${{ steps.hand.outputs.patch-part-2 }}
      patch-part-3: ${{ steps.hand.outputs.patch-part-3 }}
      patch-part-4: ${{ steps.hand.outputs.patch-part-4 }}
      patch-part-5: ${{ steps.hand.outputs.patch-part-5 }}
      patch-part-6: ${{ steps.hand.outputs.patch-part-6 }}
      patch-part-7: ${{ steps.hand.outputs.patch-part-7 }}
      patch-part-8: ${{ steps.hand.outputs.patch-part-8 }}
      body: ${{ steps.hand.outputs.body }}
    env:
      PINS: ${{ inputs.workflow-pins }}
      PIN_COPIES: ${{ inputs.pin-copies }}
      CHECK_WORKFLOW: ${{ inputs.check-workflow }}
      PACKAGE_REPOSITORY: ${{ inputs.package-repository }}
      COMPILER_REPOSITORY: ${{ inputs.compiler-repository }}
      BASE: ${{ inputs.base }}
      BRANCH_PREFIX: ${{ inputs.branch-prefix }}
      WORKFLOWS_DIRECTORY: ${{ inputs.workflows-directory }}
      PUBLISH: ${{ inputs.publish }}
      REPIN_PATHS: ${{ inputs.repin-paths }}
      REPIN_MAX_BYTES: ${{ inputs.repin-max-bytes }}
      ACTIONS_RELEASES: ${{ inputs.actions-releases }}
      ACTIONS_NOW: ${{ inputs.actions-now }}
      NPM_NOW: ${{ inputs.npm-now }}
      NPM_IGNORE: ${{ inputs.npm-ignore }}
      GRADLE_NOW: ${{ inputs.gradle-now }}
      GRADLE_IGNORE: ${{ inputs.gradle-ignore }}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      HAS_RELOCK_TOKEN: ${{ secrets.RELOCK_TOKEN != '' }}
    steps:
      # The repository's default token reads it (a private one too); this job
      # makes no authenticated call and never sees RELOCK_TOKEN's value
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false

      # The compiler and the package repository are relocked against their
      # newest main, so their commits are looked up here and handed to
      # bats's setup action as its pins. The setup action builds
      # bats-lang/bats and clones bats-lang/repository-prototype only: say
      # so rather than build another compiler than the one named.
      - name: Find the newest compiler and package repository
        id: newest
        run: |
          set -eu
          [ "$COMPILER_REPOSITORY" = bats-lang/bats ] \
            || { echo "::error::compiler-repository is $COMPILER_REPOSITORY: bats's setup action builds bats-lang/bats only"; exit 1; }
          [ "$PACKAGE_REPOSITORY" = bats-lang/repository-prototype ] \
            || { echo "::error::package-repository is $PACKAGE_REPOSITORY: bats's setup action clones bats-lang/repository-prototype only"; exit 1; }
          compiler=$(git ls-remote "https://github.com/$COMPILER_REPOSITORY.git" HEAD | cut -f1)
          repository=$(git ls-remote "https://github.com/$PACKAGE_REPOSITORY.git" HEAD | cut -f1)
          for sha in "$compiler" "$repository"; do
            case $sha in
              *[!0-9a-f]*|'') echo "::error::no commit found for a newest HEAD (got '$sha')"; exit 1 ;;
            esac
            [ ${#sha} -eq 40 ] || { echo "::error::not a full commit SHA: '$sha'"; exit 1; }
          done
          {
            echo "compiler=$compiler"
            echo "repository=$repository"
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # What every bats job does first (bats-lang/bats .github/actions/setup,
      # called by commit): the compiler built from the checked-in bootstrap C
      # of the commit named, ATS2 installed by bats itself (`bats ats2
      # install`, its tarball from a fixed commit, its SHA-256 checked before
      # it is unpacked), the package repository cloned at its commit into
      # ~/repository (BATS_REPOSITORY). The caller's own pin files are not
      # read: the newest commits are given. The caller may have no bats.lock.
      - name: Set up bats at its newest
        uses: bats-lang/bats/.github/actions/setup@67ebbf0c4744edce26584eef60ea26438945bab7 # bats main
        with:
          bats-version: ${{ steps.newest.outputs.compiler }}
          repository-version: ${{ steps.newest.outputs.repository }}
          commit: ${{ steps.newest.outputs.head }}
          require-lock: 'false'

      # tools/repin, from the package repository the setup step cloned
      - name: Build the pin mover
        run: |
          set -eu
          cd "$BATS_REPOSITORY/tools/repin"
          bats build --repository "$BATS_REPOSITORY"

      # The releases of the actions the workflows use, as repin's releases file
      # (area: repin actions). The default token reads public releases; this
      # step writes nothing but the file, and a failed call fails the step.
      - name: Collect the releases of the actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p ~/relock
          : > ~/relock/releases
          case "$WORKFLOWS_DIRECTORY$ACTIONS_RELEASES" in
            -*|*[!A-Za-z0-9._/-]*) echo "::error::workflows-directory or actions-releases is refused"; exit 1 ;;
          esac
          if [ -n "$ACTIONS_RELEASES" ]; then
            cat -- "$ACTIONS_RELEASES" > ~/relock/releases
            echo "the releases are the file $ACTIONS_RELEASES"
            exit 0
          fi
          [ -d "$WORKFLOWS_DIRECTORY" ] || exit 0
          # the repositories of the third-party actions, found as text on the
          # `uses:` lines (bats-lang's pins move by the workflow pins)
          grep -rhoE 'uses:[[:space:]]+[A-Za-z0-9_][A-Za-z0-9._-]*/[A-Za-z0-9._-]+' "$WORKFLOWS_DIRECTORY" \
            | awk '$2 ~ /^[A-Za-z0-9_][A-Za-z0-9._-]*\/[A-Za-z0-9_][A-Za-z0-9._-]*$/ && $2 !~ /^bats-lang\// { print $2 }' \
            | sort -u > ~/relock/action-repositories || true
          while read -r repository; do
            git ls-remote --tags "https://github.com/$repository.git" > ~/relock/tags
            gh api --paginate "repos/$repository/releases?per_page=100" \
              --jq '.[] | select((.draft | not) and (.prerelease | not)) | "\(.tag_name) \(.published_at)"' > ~/relock/published
            while read -r tag published; do
              case "$tag" in ''|*[!A-Za-z0-9._-]*) continue ;; esac
              seconds=$(date -u -d "$published" +%s)
              # an annotated tag's line ends ^{}: the commit it points to
              commit=$(awk -v ref="refs/tags/$tag" '
                # tag-commit begin
                $2 == ref "^{}" { peeled = $1 }
                $2 == ref { direct = $1 }
                END { print (peeled != "" ? peeled : direct) }
                # tag-commit end
              ' ~/relock/tags)
              [ -n "$commit" ] || continue
              printf '%s %s %s %s\n' "$repository" "$tag" "$commit" "$seconds" >> ~/relock/releases
            done < ~/relock/published
          done < ~/relock/action-repositories
          echo "collected $(wc -l < ~/relock/releases) releases of $(wc -l < ~/relock/action-repositories) actions"

      # The repin command's files and records, as data from a job that ran
      # the newest packages' code (see the header)
      - name: Download what the repin command wrote
        if: inputs.repin-command != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.repin.outputs.artifact }}
          path: ${{ runner.temp }}/repin

      # Nothing is extracted by tar: each member is checked and its bytes are
      # written by this script, as a regular file under a listed path (the
      # same rule as publish's, which takes the regenerated files)
      - name: Take the repinned files, as data
        if: inputs.repin-command != ''
        run: |
          python3 -I - "$RUNNER_TEMP/repin/files.tar" <<'PY'
          # repin-take begin
          import os, re, shutil, sys, tarfile
          paths = [p for p in os.environ['REPIN_PATHS'].split('\n') if p]
          cap = int(os.environ['REPIN_MAX_BYTES'])
          allowed = re.compile(r'^[A-Za-z0-9._/@+=,-]+$')
          def refused(name):
              if (not allowed.fullmatch(name) or name.startswith('/')
                      or name.startswith('-') or name.endswith('/')):
                  return True
              for part in name.split('/'):
                  if part in ('', '.', '..') or part.lower() in ('.git', '.github', '.gitmodules', '.gitattributes'):
                      return True
              return False
          def die(message):
              print('::error::' + message)
              sys.exit(1)
          if not paths:
              die('repin-paths is empty')
          for path in paths:
              if refused(path):
                  die('repin-paths names a path that is refused: %r' % path)
          directories, files, total = [], [], 0
          with tarfile.open(sys.argv[1], 'r:') as archive:
              members = archive.getmembers()
              if len(members) > 100000:
                  die('too many members in the repinned files')
              for member in members:
                  name = member.name
                  if refused(name) or not any(name == p or name.startswith(p + '/') for p in paths):
                      die('a member outside the listed paths or with a refused name: %r' % name)
                  if member.isdir():
                      directories.append(name)
                  elif member.isreg():
                      total += member.size
                      if total > cap:
                          die('the repinned files are over repin-max-bytes (%d)' % cap)
                      files.append(member)
                  else:
                      die('a member that is not a regular file or a directory: %r' % name)
              for path in paths:
                  if not any(m.name == path for m in members):
                      die('the repinned files do not hold %s' % path)
                  walked = ''
                  for part in path.split('/')[:-1]:
                      walked = os.path.join(walked, part)
                      if os.path.islink(walked):
                          die('%s is a link in the checkout' % walked)
              # every check is done: only now is anything of the checkout replaced
              for path in paths:
                  if os.path.islink(path) or os.path.isfile(path):
                      os.remove(path)
                  elif os.path.isdir(path):
                      shutil.rmtree(path)
              for name in directories:
                  os.makedirs(name, exist_ok=True)
              for member in files:
                  os.makedirs(os.path.dirname(member.name) or '.', exist_ok=True)
                  data = archive.extractfile(member).read()
                  mode = 0o755 if member.mode & 0o100 else 0o644
                  descriptor = os.open(member.name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)
                  with os.fdopen(descriptor, 'wb') as out:
                      out.write(data)
                  os.chmod(member.name, mode)
          print('took %d files (%d bytes) under %s' % (len(files), total, ', '.join(paths)))
          # repin-take end
          PY

      # The records are rendered by tools/repin (built from the package
      # repository the setup step cloned), which refuses a line that is not a
      # record; no record, no table
      - name: Render the repin records
        if: inputs.repin-command != ''
        run: |
          set -eu
          mkdir -p ~/relock
          : > ~/relock/repin-table.md
          if [ -s "$RUNNER_TEMP/repin/records" ]; then
            "$BATS_REPOSITORY/tools/repin/dist/debug/repin" table "$RUNNER_TEMP/repin/records" > ~/relock/repin-table.md
          fi

      # Node by .nvmrc when the checkout has one (else the runner's), for the
      # pinned pnpm that corepack runs (area: repin npm)
      - name: Set up Node for the npm dependencies
        if: hashFiles(inputs.npm-node-version-file) != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.npm-node-version-file }}
          package-manager-cache: false

      # The npm dependencies (area: repin npm): see the header. Nothing is
      # installed and no script runs; only package.json and pnpm-lock.yaml move.
      - name: Move the npm dependencies within their ranges
        run: |
          set -euo pipefail
          repin=$BATS_REPOSITORY/tools/repin/dist/debug/repin
          work=~/relock/npm
          mkdir -p "$work"
          : > ~/relock/npm-records
          now=${NPM_NOW:-$(date -u +%s)}
          root=$PWD
          printf '%s\n' "$NPM_IGNORE" > "$work/ignored"
          find . -name pnpm-lock.yaml -not -path '*/node_modules/*' -not -path './.git/*' | LC_ALL=C sort > "$work/locks"
          count=0
          while IFS= read -r lock; do
            dir=${lock%/pnpm-lock.yaml}
            case "$dir" in
              *[!A-Za-z0-9._/-]*) echo "::error::a directory with a pnpm-lock.yaml has a name that is refused: $dir"; exit 1 ;;
            esac
            [ -f "$dir/package.json" ] || continue
            skip=no
            while IFS= read -r ignored; do
              [ -n "$ignored" ] || continue
              case "$dir" in "./$ignored"|"./$ignored"/*) skip=yes ;; esac
            done < "$work/ignored"
            if [ "$skip" = yes ]; then echo "left alone (npm-ignore): $dir"; continue; fi
            case "$(jq -r '.packageManager // empty' "$dir/package.json")" in
              pnpm@*) ;;
              *) echo "::error::$dir/package.json has no packageManager that names pnpm: its lock cannot be updated with the pinned pnpm"; exit 1 ;;
            esac
            cd "$dir"
            # the projects of the lock's directory, as pnpm names them
            corepack pnpm -r ls --depth -1 --json | jq -r '.[].path' > "$work/projects"
            while IFS= read -r project; do
              count=$((count + 1))
              outdated=$work/$count.outdated; compatible=$work/$count.compatible
              times=$work/$count.times; updates=$work/$count.updates
              # pnpm outdated exits 1 when something is outdated; no output is a failure
              corepack pnpm -C "$project" outdated --format json > "$outdated" || [ -s "$outdated" ] \
                || { echo "::error::pnpm outdated failed in $project"; exit 1; }
              corepack pnpm -C "$project" outdated --format json --compatible > "$compatible" || [ -s "$compatible" ] \
                || { echo "::error::pnpm outdated --compatible failed in $project"; exit 1; }
              # the publish time of each version of the majors in play (the
              # current and the latest of each dependency), name version seconds
              : > "$times"
              jq -r 'keys[]' "$outdated" "$compatible" | LC_ALL=C sort -u > "$work/names"
              while IFS= read -r name; do
                majors=$(jq -s -c --arg name "$name" '[.[] | .[$name] | select(. != null) | (.current, .latest) | split(".")[0]] | unique' "$outdated" "$compatible")
                corepack pnpm -C "$project" view "$name" time --json \
                  | jq -r --arg name "$name" --argjson majors "$majors" 'del(.created, .modified) | to_entries[] | select(.key | split(".")[0] | IN($majors[])) | "\($name) \(.key) \(.value | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)"' >> "$times"
              done < "$work/names"
              "$repin" npm "$outdated" "$compatible" "$times" "$now" "$updates" >> ~/relock/npm-records
              if [ -s "$updates" ]; then
                set --
                while IFS= read -r update; do set -- "$@" "$update"; done < "$updates"
                echo "moving in $project: $*"
                corepack pnpm -C "$project" update --lockfile-only --ignore-scripts "$@"
              fi
            done < "$work/projects"
            cd "$root"
          done < "$work/locks"
          echo "looked at $count pnpm projects; $(wc -l < ~/relock/npm-records) records"

      # The JDK of the repository's .java-version when the checkout has one
      # (else the runner's), for the wrapper that runs Gradle (area: repin gradle)
      - name: Set up Java for the Gradle wrapper
        if: hashFiles(inputs.gradle-java-version-file) != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: ${{ inputs.gradle-java-version-file }}

      # The Gradle wrapper (area: repin gradle): see the header. Gradle writes
      # the files; this step decides nothing, repin does.
      - name: Move the Gradle wrapper within its major
        run: |
          set -euo pipefail
          repin=$BATS_REPOSITORY/tools/repin/dist/debug/repin
          work=~/relock/gradle
          mkdir -p "$work"
          : > ~/relock/gradle-records
          now=${GRADLE_NOW:-$(date -u +%s)}
          root=$PWD
          printf '%s\n' "$GRADLE_IGNORE" > "$work/ignored"
          find . -path '*/gradle/wrapper/gradle-wrapper.properties' -not -path '*/node_modules/*' -not -path './.git/*' | LC_ALL=C sort > "$work/wrappers"
          # the first run of repin only learns the target: any 64 hex digits will do
          printf '%064d\n' 0 > "$work/placeholder"
          count=0
          fetched=no
          while IFS= read -r properties; do
            wrapper_directory=${properties%/gradle-wrapper.properties}
            project=${wrapper_directory%/gradle/wrapper}
            case "$project" in
              *[!A-Za-z0-9._/-]*) echo "::error::a directory with a Gradle wrapper has a name that is refused: $project"; exit 1 ;;
            esac
            skip=no
            while IFS= read -r ignored; do
              [ -n "$ignored" ] || continue
              case "$project" in "./$ignored"|"./$ignored"/*) skip=yes ;; esac
            done < "$work/ignored"
            if [ "$skip" = yes ]; then echo "left alone (gradle-ignore): $project"; continue; fi
            [ -x "$project/gradlew" ] || { echo "::error::$properties has no executable gradlew beside it: the wrapper cannot be run"; exit 1; }
            if [ "$fetched" = no ]; then
              # unpinned: Gradle's versions/all is the source the pin is taken from; no checksum of it exists to check (check-pins keyword: source of truth, repository-prototype#439)
              # compact, so the text stays far under the 524288 bytes repin reads
              curl -fsSL --retry 3 --retry-delay 5 https://services.gradle.org/versions/all | jq -c . > "$work/versions.json"
              fetched=yes
            fi
            count=$((count + 1))
            updates=$work/$count.updates; records=$work/$count.records; checksum_file=$work/$count.sha256
            "$repin" gradle "$properties" "$work/versions.json" "$work/placeholder" "$now" "$updates" > "$records"
            if [ -s "$updates" ]; then
              read -r version < "$updates"
              case "$version" in
                ''|*[!0-9A-Za-z.-]*) echo "::error::repin named a Gradle version that is refused: $version"; exit 1 ;;
              esac
              # unpinned: this download is Gradle's own published .sha256 for the release, the checksum the pin copies; it has none of its own (check-pins keyword: source of truth, repository-prototype#439)
              # the checksum Gradle publishes for the target, copied and never computed
              curl -fsSL --retry 3 --retry-delay 5 -o "$checksum_file" "https://services.gradle.org/distributions/gradle-$version-bin.zip.sha256"
              "$repin" gradle "$properties" "$work/versions.json" "$checksum_file" "$now" "$updates" > "$records"
              { read -r version; read -r checksum; } < "$updates"
              echo "moving $properties to Gradle $version, distributionSha256Sum $checksum"
              # the old wrapper writes the properties, the new Gradle then writes the scripts and the jar
              for pass in 1 2; do
                (cd "$project" && ./gradlew --no-daemon --console=plain --project-cache-dir "$work/$count.cache" \
                  wrapper --gradle-version "$version" --gradle-distribution-sha256-sum "$checksum")
              done
              grep -Fxq 'distributionUrl=https\://services.gradle.org/distributions/gradle-'"$version"'-bin.zip' "$properties" \
                || { echo "::error::$properties does not name Gradle $version after the wrapper task"; exit 1; }
              grep -Fxq "distributionSha256Sum=$checksum" "$properties" \
                || { echo "::error::$properties does not hold the published checksum $checksum after the wrapper task"; exit 1; }
            fi
            cat "$records" >> ~/relock/gradle-records
          done < "$work/wrappers"
          echo "looked at $count Gradle wrappers; $(wc -l < ~/relock/gradle-records) records"

      - name: Relock and move the pins
        env:
          COMPILER_NEWEST: ${{ steps.newest.outputs.compiler }}
          REPOSITORY_NEWEST: ${{ steps.newest.outputs.repository }}
        run: |
          set -eu
          mkdir -p ~/relock
          # What was pinned, for the pull request's lists
          if [ -f bats.lock ]; then cp bats.lock ~/relock/old.lock; else : > ~/relock/old.lock; fi
          compiler_old=$(tr -d '[:space:]' < .github/bats-version 2>/dev/null || true)
          compiler_new=$COMPILER_NEWEST
          repository_new=$REPOSITORY_NEWEST
          repository_old=$(tr -d '[:space:]' < .github/repository-version 2>/dev/null || true)
          # A package with no dependencies has no lock, and gets none
          if [ -f bats.lock ]; then bats lock --repository "$BATS_REPOSITORY"; fi
          if [ -f .github/bats-version ]; then printf '%s\n' "$compiler_new" > .github/bats-version; fi
          if [ -f .github/repository-version ]; then printf '%s\n' "$repository_new" > .github/repository-version; fi

          # Each workflow pin, to its repository's newest main commit, with
          # the comment `# <repo> main <7 hex>` that bats check-pins requires
          # (#395, area: relock comment). Line-oriented rewriting of `uses:`
          # lines (as the sed it replaced did): the pin is found as text with
          # index(), the text around it is matched with patterns, and every
          # spelling not recognised is refused (the step fails naming the file,
          # the line number and the line, and nothing is written back). It
          # decides nothing about pass or fail. relock-pins-test.yml runs this
          # very awk program (between the pin-rewrite markers) on fixtures.
          case "$WORKFLOWS_DIRECTORY" in
            ''|-*|*[!A-Za-z0-9._/-]*) echo "::error::workflows-directory is refused: $WORKFLOWS_DIRECTORY"; exit 1 ;;
          esac
          : > ~/relock/pins
          for pin in $PINS; do
            owner_repo=$(printf '%s' "$pin" | cut -d/ -f1-2)
            newest=$(git ls-remote "https://github.com/$owner_repo.git" refs/heads/main | cut -f1)
            test -n "$newest" || { echo "::error::no main in $owner_repo"; exit 1; }
            old=$(grep -rhF -- "$pin@" "$WORKFLOWS_DIRECTORY" | awk -v pin="$pin@" '{ i = index($0, pin); if (i) { t = substr($0, i + length(pin)); sub(/[ \t].*/, "", t); print t; exit } }')
            test -n "$old" || { echo "::error::no workflow in $WORKFLOWS_DIRECTORY calls $pin"; exit 1; }
            comment="${owner_repo#*/} main $(printf '%.7s' "$newest")"
            grep -rlF -- "$pin@" "$WORKFLOWS_DIRECTORY" > ~/relock/pin-files
            while IFS= read -r file; do
              awk -v pin="$pin@" -v newest="$newest" -v comment="$comment" -v file="$file" '
                # pin-rewrite begin
                {
                  i = index($0, pin)
                  if (!i) { print; next }
                  before = substr($0, 1, i - 1)
                  tail = substr($0, i + length(pin))
                  match(tail, /^[A-Za-z0-9._-]*/)
                  rest = substr(tail, RLENGTH + 1)
                  if (before !~ /^[ \t]*(-[ \t]+)?uses:[ \t]+$/ || rest !~ /^[ \t]*(#.*)?$/) {
                    print "::error file=" file ",line=" NR "::refused, not a plain uses line of the pin: " $0
                    exit 1
                  }
                  print before pin newest " # " comment
                }
                # pin-rewrite end
              ' "$file" > ~/relock/pin-file.new || exit 1
              cat ~/relock/pin-file.new > "$file"
            done < ~/relock/pin-files
            # The caller's copies of the pin's commit (pin-copies, #385): each
            # `<input>: <40 hex>` line of the files that call the pin gets the
            # commit the pin got; any other spelling of that key is refused
            # (file, line number and line named, nothing written). The program
            # between the copy-rewrite markers is run on fixtures by
            # relock-pins-test.yml.
            printf '%s\n' "$PIN_COPIES" | while read -r copy_pin copy_input copy_extra; do
              [ "$copy_pin" = "$pin" ] || continue
              case "$copy_input" in
                ''|*[!A-Za-z0-9_-]*) echo "::error::pin-copies names an input that is refused: '$copy_input'"; exit 1 ;;
              esac
              [ -z "$copy_extra" ] || { echo "::error::pin-copies line has more than a pin and an input: $copy_pin $copy_input $copy_extra"; exit 1; }
              while IFS= read -r file; do
                awk -v input="$copy_input" -v newest="$newest" -v file="$file" '
                  # copy-rewrite begin
                  {
                    if ($0 !~ ("^[ \t]*" input ":")) { print; next }
                    if ($0 !~ ("^[ \t]*" input ":[ \t]+[0-9a-f][0-9a-f]*[ \t]*(#.*)?$")) {
                      print "::error file=" file ",line=" NR "::refused, not a plain " input " line: " $0
                      exit 1
                    }
                    match($0, ":[ \t]+[0-9a-f]+")
                    value = $0
                    sub(/^[^:]*:[ \t]+/, "", value)
                    sub(/[^0-9a-f].*$/, "", value)
                    if (length(value) != 40) {
                      print "::error file=" file ",line=" NR "::refused, not a 40 hex digit commit: " $0
                      exit 1
                    }
                    print substr($0, 1, RSTART + RLENGTH - 41) newest substr($0, RSTART + RLENGTH)
                  }
                  # copy-rewrite end
                ' "$file" > ~/relock/copy-file.new || exit 1
                cat ~/relock/copy-file.new > "$file"
              done < ~/relock/pin-files
            done
            if [ "$old" != "$newest" ]; then
              printf '%s %s %s %s\n' "$pin" "$owner_repo" "$old" "$newest" >> ~/relock/pins
            fi
          done

          # The action pins (area: repin actions): tools/repin moves them in
          # the workflow files and prints a record for each pin examined
          repin=$BATS_REPOSITORY/tools/repin/dist/debug/repin
          : > ~/relock/actions-records
          if [ -d "$WORKFLOWS_DIRECTORY" ]; then
            "$repin" actions "$WORKFLOWS_DIRECTORY" "${ACTIONS_NOW:-$(date -u +%s)}" ~/relock/releases > ~/relock/actions-records
          fi
          cp ~/relock/actions-records ~/relock/actions-shown
          : > ~/relock/actions-left

          # The workflow pins stay where they are when GITHUB_TOKEN would
          # have to change workflow files, which it cannot (a run that
          # publishes nothing has no push to refuse); so do the action pins
          # that would move, which are listed as not moved
          : > ~/relock/pins-left
          if [ "$HAS_RELOCK_TOKEN" != true ] && [ "$PUBLISH" = true ]; then
            git checkout -- "$WORKFLOWS_DIRECTORY"
            mv ~/relock/pins ~/relock/pins-left
            : > ~/relock/pins
            while read -r pin owner_repo old new; do
              echo "::warning::$pin is pinned at $old; its newest is $new. GITHUB_TOKEN cannot change workflow files: move it in a pull request, or give this workflow a RELOCK_TOKEN secret."
            done < ~/relock/pins-left
            : > ~/relock/actions-shown
            awk -F'\t' -v shown="$HOME/relock/actions-shown" -v left="$HOME/relock/actions-left" '
              # actions-left begin
              $6 == "moved" { print > left; next }
              { print > shown }
              # actions-left end
            ' ~/relock/actions-records
            while IFS="$(printf '\t')" read -r kind name old new age status; do
              echo "::warning::$name is pinned at $old; its newest release is $new. GITHUB_TOKEN cannot change workflow files: move it in a pull request, or give this workflow a RELOCK_TOKEN secret."
            done < ~/relock/actions-left
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to relock: every pin is the newest." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$REPIN_PATHS" ]; then
              echo "The repin command moved nothing." | tee -a "$GITHUB_STEP_SUMMARY"
              if [ -s ~/relock/repin-table.md ]; then cat ~/relock/repin-table.md >> "$GITHUB_STEP_SUMMARY"; fi
            fi
            echo "changed=no" > ~/relock/state
            exit 0
          fi
          echo "changed=yes" > ~/relock/state

          # The pull request's text: each version that moved
          {
            echo "The daily relock (bats-lang/repository-prototype#269): the packages relocked against the newest \`$PACKAGE_REPOSITORY\`, and the CI pins moved to their newest."
            echo
            echo "### Packages (\`bats.lock\`)"
            echo
            awk 'NR == FNR { old[$1] = $2; next } { new[$1] = $2 }
              END {
                for (p in new) if (!(p in old)) print p, "(none)", new[p]
                for (p in new) if ((p in old) && old[p] != new[p]) print p, old[p], new[p]
                for (p in old) if (!(p in new)) print p, old[p], "(none)"
              }' ~/relock/old.lock bats.lock | sort > ~/relock/packages
            if [ -s ~/relock/packages ]; then
              echo "| Package | Old | New |"
              echo "|---|---|---|"
              while read -r name old new; do echo "| \`$name\` | $old | $new |"; done < ~/relock/packages
            else
              echo "No package moved."
            fi
            if [ -f .github/bats-version ]; then
              echo
              echo "### Compiler (\`.github/bats-version\`)"
              echo
              if [ "$compiler_old" = "$compiler_new" ]; then
                echo "Unchanged: \`$compiler_new\`."
              else
                echo "\`${compiler_old:-(none)}\` → \`$compiler_new\` ([changes](https://github.com/$COMPILER_REPOSITORY/compare/$compiler_old...$compiler_new))"
              fi
            fi
            if [ -f .github/repository-version ]; then
              echo
              echo "### Package repository (\`.github/repository-version\`)"
              echo
              if [ "$repository_old" = "$repository_new" ]; then
                echo "Unchanged: \`$repository_new\`."
              else
                echo "\`${repository_old:-(none)}\` → \`$repository_new\` ([changes](https://github.com/$PACKAGE_REPOSITORY/compare/$repository_old...$repository_new))"
              fi
            fi
            if [ -s ~/relock/pins ] || [ -s ~/relock/pins-left ]; then
              echo
              echo "### Workflows"
              echo
              while read -r pin owner_repo old new; do
                echo "- \`$pin\`: \`$old\` → \`$new\` ([changes](https://github.com/$owner_repo/compare/$old...$new))"
              done < ~/relock/pins
              while read -r pin owner_repo old new; do
                echo "- \`$pin\` **not moved**: its newest is \`$new\` (now \`$old\`, [changes](https://github.com/$owner_repo/compare/$old...$new)). GITHUB_TOKEN cannot change files in \`.github/workflows\`: move it in a pull request, or give this workflow a \`RELOCK_TOKEN\` secret that can."
              done < ~/relock/pins-left
            fi
            if [ -s ~/relock/actions-shown ] || [ -s ~/relock/actions-left ]; then
              echo
              echo "### Actions"
              echo
              if [ -s ~/relock/actions-shown ]; then "$repin" table ~/relock/actions-shown; fi
              if [ -s ~/relock/actions-shown ] && [ -s ~/relock/actions-left ]; then echo; fi
              awk -F'\t' '
                # actions-bullet begin
                {
                  unit = ($5 == 1) ? "day" : "days"
                  print "- `" $2 "` (" $1 "): `" $3 "` → `" $4 "`, release age " $5 " " unit ", **not moved**: GITHUB_TOKEN cannot change files in `.github/workflows`: move it in a pull request, or give this workflow a `RELOCK_TOKEN` secret that can."
                }
                # actions-bullet end
              ' ~/relock/actions-left
            fi
            if [ -s ~/relock/npm-records ]; then
              echo
              echo "### npm"
              echo
              "$repin" table ~/relock/npm-records
            fi
            if [ -s ~/relock/gradle-records ]; then
              echo
              echo "### Gradle"
              echo
              "$repin" table ~/relock/gradle-records
            fi
            if [ -s ~/relock/repin-table.md ]; then
              echo
              echo "### Moved by the repin command"
              echo
              cat ~/relock/repin-table.md
            fi
            echo
            echo "If a check here fails, a newer version broke this project: fix it on this branch (or in a pull request of its own that commits the pins), and main stays green meanwhile."
          } > ~/relock/body.md
          cat ~/relock/body.md >> "$GITHUB_STEP_SUMMARY"

      # What job 2 and job 3 take from this one: the change as a patch (the
      # pins, the lock and any workflow pin this job moved) and the pull
      # request's text, as job outputs, which no later job can alter
      - name: Hand the change on
        id: hand
        run: |
          set -eu
          state=$(sed 's/^changed=//' ~/relock/state)
          echo "changed=$state" >> "$GITHUB_OUTPUT"
          [ "$state" = yes ] || exit 0
          # the day's branch, decided once here and passed on
          case "$BRANCH_PREFIX" in
            ''|-*|*[!A-Za-z0-9._/-]*) echo "::error::branch-prefix is refused: $BRANCH_PREFIX"; exit 1 ;;
          esac
          date=$(date -u +%Y-%m-%d)
          { echo "date=$date"; echo "branch=$BRANCH_PREFIX$date"; } >> "$GITHUB_OUTPUT"
          git add -A .github "$WORKFLOWS_DIRECTORY"
          if [ -f bats.lock ]; then git add bats.lock; fi
          # the npm files pnpm rewrote (tracked ones only; area: repin npm)
          git add -u -- ':(glob)**/package.json' ':(glob)**/pnpm-lock.yaml'
          # the Gradle wrapper's files (tracked ones only; area: repin gradle)
          git add -u -- ':(glob)**/gradle/wrapper/gradle-wrapper.properties' ':(glob)**/gradle/wrapper/gradle-wrapper.jar' ':(glob)**/gradlew' ':(glob)**/gradlew.bat'
          # one path per line, never split or expanded
          printf '%s\n' "$REPIN_PATHS" | while IFS= read -r path; do
            [ -z "$path" ] || git add -A -- ":(literal)$path"
          done
          patch=$(git diff --cached --binary | gzip -9n | base64 -w0)
          body=$(base64 -w0 ~/relock/body.md)
          # an environment variable of a later step is limited to 128 KiB
          [ ${#patch} -lt 800000 ] && [ ${#body} -lt 20000 ] \
            || { echo "::error::the relock's change is larger than the jobs hand on (patch ${#patch}, text ${#body})"; exit 1; }
          # the patch in pieces of 100000 characters (an environment variable holds 128 KiB)
          { echo "patch=${patch:0:100000}"; echo "body=$body"; } >> "$GITHUB_OUTPUT"
          for piece in 2 3 4 5 6 7 8; do
            echo "patch-part-$piece=${patch:$(((piece - 1) * 100000)):100000}" >> "$GITHUB_OUTPUT"
          done

  # Job 2: the caller's command, with nothing to steal and nothing later
  # that trusts it (see the header)
  regenerate:
    needs: relock
    if: inputs.regenerate != '' && needs.relock.outputs.changed == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.regenerate-timeout-minutes) }}
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.relock.outputs.head }}
          persist-credentials: false

      - name: Set up bats at its newest
        uses: bats-lang/bats/.github/actions/setup@67ebbf0c4744edce26584eef60ea26438945bab7 # bats main
        with:
          bats-version: ${{ needs.relock.outputs.compiler }}
          repository-version: ${{ needs.relock.outputs.repository }}
          commit: ${{ needs.relock.outputs.head }}
          require-lock: 'false'

      - name: Apply the relock, run the command and pack the listed paths
        env:
          PATCH: ${{ needs.relock.outputs.patch }}
          PATCH_PART_2: ${{ needs.relock.outputs.patch-part-2 }}
          PATCH_PART_3: ${{ needs.relock.outputs.patch-part-3 }}
          PATCH_PART_4: ${{ needs.relock.outputs.patch-part-4 }}
          PATCH_PART_5: ${{ needs.relock.outputs.patch-part-5 }}
          PATCH_PART_6: ${{ needs.relock.outputs.patch-part-6 }}
          PATCH_PART_7: ${{ needs.relock.outputs.patch-part-7 }}
          PATCH_PART_8: ${{ needs.relock.outputs.patch-part-8 }}
          REGENERATE: ${{ inputs.regenerate }}
          REGENERATE_PATHS: ${{ inputs.regenerate-paths }}
          MAX_BYTES: ${{ inputs.regenerate-max-bytes }}
        run: |
          set -eu
          [ -n "$REGENERATE_PATHS" ] \
            || { echo "::error::regenerate is given without regenerate-paths: nothing would be committed"; exit 1; }
          # the path rule, as job 3's Python states it (see the header)
          refused() {
            case "$1" in
              ''|-*|/*|*/|*//*|*[!A-Za-z0-9._/@+=,-]*) return 0 ;;
            esac
            lower=$(printf '%s' "$1" | tr 'A-Z' 'a-z')
            case "/$lower/" in
              */./*|*/../*|*/.git/*|*/.github/*|*/.gitmodules/*|*/.gitattributes/*) return 0 ;;
            esac
            return 1
          }
          printf '%s\n' "$REGENERATE_PATHS" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            if refused "$path"; then
              echo "::error::regenerate-paths names a path that is refused: $path"; exit 1
            fi
          done
          { printf '%s' "$PATCH"; printf '%s' "$PATCH_PART_2$PATCH_PART_3$PATCH_PART_4$PATCH_PART_5$PATCH_PART_6$PATCH_PART_7$PATCH_PART_8"; } | base64 -d | gunzip | git apply --binary
          sh -eu -c "$REGENERATE"
          printf '%s\n' "$REGENERATE_PATHS" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ -e "$path" ] || { echo "::error::the command did not write $path"; exit 1; }
            if [ -n "$(find "$path" ! -type f ! -type d -print -quit)" ] || [ -L "$path" ]; then
              echo "::error::$path holds something that is not a regular file or a directory: $(find "$path" ! -type f ! -type d -print -quit)"; exit 1
            fi
          done
          printf '%s\n' "$REGENERATE_PATHS" | grep -v '^$' \
            | tar --verbatim-files-from -cf "$RUNNER_TEMP/regenerated.tar" -T -
          size=$(stat -c %s "$RUNNER_TEMP/regenerated.tar")
          [ "$size" -le "$MAX_BYTES" ] \
            || { echo "::error::the regenerated files are $size bytes, over regenerate-max-bytes ($MAX_BYTES)"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated
          path: ${{ runner.temp }}/regenerated.tar
          retention-days: 1
          if-no-files-found: error

  # Job 3: the privileged half, from clean inputs only
  publish:
    needs: [relock, regenerate]
    if: >-
      always() && needs.relock.result == 'success'
      && needs.relock.outputs.changed == 'yes'
      && inputs.publish == 'true'
      && (needs.regenerate.result == 'success' || needs.regenerate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: ${{ needs.relock.outputs.branch }}
      DATE: ${{ needs.relock.outputs.date }}
      BRANCH_PREFIX: ${{ inputs.branch-prefix }}
      CHECK_WORKFLOW: ${{ inputs.check-workflow }}
      BASE: ${{ inputs.base }}
      REGENERATE_PATHS: ${{ inputs.regenerate-paths }}
      MAX_BYTES: ${{ inputs.regenerate-max-bytes }}
      PATCH: ${{ needs.relock.outputs.patch }}
      PATCH_PART_2: ${{ needs.relock.outputs.patch-part-2 }}
      PATCH_PART_3: ${{ needs.relock.outputs.patch-part-3 }}
      PATCH_PART_4: ${{ needs.relock.outputs.patch-part-4 }}
      PATCH_PART_5: ${{ needs.relock.outputs.patch-part-5 }}
      PATCH_PART_6: ${{ needs.relock.outputs.patch-part-6 }}
      PATCH_PART_7: ${{ needs.relock.outputs.patch-part-7 }}
      PATCH_PART_8: ${{ needs.relock.outputs.patch-part-8 }}
      BODY: ${{ needs.relock.outputs.body }}
      HAS_RELOCK_TOKEN: ${{ secrets.RELOCK_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.RELOCK_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.relock.outputs.head }}
          token: ${{ secrets.RELOCK_TOKEN || github.token }}
          persist-credentials: false

      - name: Apply the relock
        run: |
          set -eu
          { printf '%s' "$PATCH"; printf '%s' "$PATCH_PART_2$PATCH_PART_3$PATCH_PART_4$PATCH_PART_5$PATCH_PART_6$PATCH_PART_7$PATCH_PART_8"; } | base64 -d | gunzip | git apply --binary --index
          mkdir -p ~/relock
          printf '%s' "$BODY" | base64 -d > ~/relock/body.md

      - name: Download what the command wrote
        if: needs.regenerate.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: regenerated
          path: ${{ runner.temp }}/regenerated

      # The artifact is data from a job that ran the newest packages' code.
      # Nothing is extracted by tar: each member is checked and its bytes are
      # written by this script, as a regular file under a listed path.
      - name: Take the listed files, as data
        if: needs.regenerate.result == 'success'
        run: |
          python3 -I - "$RUNNER_TEMP/regenerated/regenerated.tar" <<'PY'
          import os, re, shutil, sys, tarfile
          paths = [p for p in os.environ['REGENERATE_PATHS'].split('\n') if p]
          cap = int(os.environ['MAX_BYTES'])
          allowed = re.compile(r'^[A-Za-z0-9._/@+=,-]+$')
          def refused(name):
              # the path rule of the header, as job 2's shell states it
              if (not allowed.fullmatch(name) or name.startswith('/')
                      or name.startswith('-') or name.endswith('/')):
                  return True
              for part in name.split('/'):
                  if part in ('', '.', '..') or part.lower() in ('.git', '.github', '.gitmodules', '.gitattributes'):
                      return True
              return False
          def die(message):
              print('::error::' + message)
              sys.exit(1)
          if not paths:
              die('regenerate-paths is empty')
          for path in paths:
              if refused(path):
                  die('regenerate-paths names a path that is refused: %r' % path)
          directories, files, total = [], [], 0
          with tarfile.open(sys.argv[1], 'r:') as archive:
              members = archive.getmembers()
              if len(members) > 100000:
                  die('too many members in the regenerated files')
              for member in members:
                  name = member.name
                  if refused(name) or not any(name == p or name.startswith(p + '/') for p in paths):
                      die('a member outside the listed paths or with a refused name: %r' % name)
                  if member.isdir():
                      directories.append(name)
                  elif member.isreg():
                      total += member.size
                      if total > cap:
                          die('the regenerated files are over regenerate-max-bytes (%d)' % cap)
                      files.append(member)
                  else:
                      die('a member that is not a regular file or a directory: %r' % name)
              for path in paths:
                  if not any(m.name == path for m in members):
                      die('the regenerated files do not hold %s' % path)
                  walked = ''
                  for part in path.split('/')[:-1]:
                      walked = os.path.join(walked, part)
                      if os.path.islink(walked):
                          die('%s is a link in the checkout' % walked)
                  if os.path.islink(path) or os.path.isfile(path):
                      os.remove(path)
                  elif os.path.isdir(path):
                      shutil.rmtree(path)
              for name in directories:
                  os.makedirs(name, exist_ok=True)
              for member in files:
                  os.makedirs(os.path.dirname(member.name) or '.', exist_ok=True)
                  data = archive.extractfile(member).read()
                  mode = 0o755 if member.mode & 0o100 else 0o644
                  descriptor = os.open(member.name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)
                  with os.fdopen(descriptor, 'wb') as out:
                      out.write(data)
                  os.chmod(member.name, mode)
          print('took %d files (%d bytes) under %s' % (len(files), total, ', '.join(paths)))
          PY

      - name: Push the branch, open the pull request and dispatch the check
        run: |
          set -eu
          branch="$BRANCH"
          repo="$GITHUB_REPOSITORY"
          git checkout -q -B "$branch"
          git add -A .github
          if [ -f bats.lock ]; then git add bats.lock; fi
          # one path per line, never split or expanded
          printf '%s\n' "$REGENERATE_PATHS" | while IFS= read -r path; do
            [ -z "$path" ] || git add -A -- ":(literal)$path"
          done
          title="Relock packages and CI pins ($DATE)"
          { echo "$title"; echo; cat ~/relock/body.md; } > ~/relock/message
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -F ~/relock/message
          # The checkout keeps no credentials: git gets the token here, as
          # actions/checkout would have written it
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git_auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $auth"
          git -c "$git_auth" push --force origin "$branch"

          number=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number // empty')
          opened=yes
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$repo" --title "$title" --body-file ~/relock/body.md
          elif gh pr create --repo "$repo" --base "$BASE" --head "$branch" \
              --title "$title" --body-file ~/relock/body.md > ~/relock/pr.out 2> ~/relock/pr.err; then
            number=$(gh pr list --repo "$repo" --head "$branch" --state open --json number --jq '.[0].number')
          else
            cat ~/relock/pr.err
            opened=no
          fi

          # The check runs on the branch's commit either way, so its result
          # shows on the pull request. A token other than GITHUB_TOKEN
          # starts the pull request's checks by itself.
          if [ "$HAS_RELOCK_TOKEN" != true ]; then
            gh workflow run "$CHECK_WORKFLOW" --repo "$repo" --ref "$branch"
          fi

          issue_title='Allow GitHub Actions to create pull requests, for the daily relock'
          issue=$(gh issue list --repo "$repo" --state open --search "\"$issue_title\" in:title" --json number --jq '.[0].number // empty')

          if [ "$opened" = yes ]; then
            # An older relock is superseded by this one
            gh pr list --repo "$repo" --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"$BRANCH_PREFIX\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r older; do
              gh pr close "$older" --repo "$repo" --delete-branch --comment "Superseded by #$number."
            done
            # The setting is on now: the issue that asked for it is done
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$repo" --comment "The relock opened #$number: GitHub Actions may create pull requests now."
            fi
            echo "Relock pull request: #$number" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! grep -qi "not permitted to create or approve pull requests" ~/relock/pr.err; then
            echo "::error::Could not open the relock pull request for $branch (see the output above)."
            exit 1
          fi

          # Without a pull request, only the newest relock branch is kept: an
          # older one is superseded, as its pull request would be (unless
          # someone opened a pull request from it by hand)
          git -c "$git_auth" ls-remote --heads origin "$BRANCH_PREFIX*" | sed 's|.*refs/heads/||' | while read -r older; do
            [ "$older" != "$branch" ] || continue
            if [ -z "$(gh pr list --repo "$repo" --head "$older" --state open --json number --jq '.[0].number // empty')" ]; then
              git -c "$git_auth" push -q origin --delete "$older" || true
            fi
          done

          # One "human only" issue says how to turn the setting on, and
          # always names the newest branch; it is closed by the first run
          # that opens its pull request once the setting is on
          cat > ~/relock/issue.md <<ISSUE
          The daily relock (\`.github/workflows/relock.yml\`, bats-lang/repository-prototype#269) pushes its branch and starts \`$CHECK_WORKFLOW\` on it, but cannot open the pull request: GitHub Actions may not create pull requests here. Only an administrator can change that.

          **The newest relock:** branch [\`$branch\`]($GITHUB_SERVER_URL/$repo/compare/$BASE...$branch) (a pull request can be opened from it by hand meanwhile), its [\`$CHECK_WORKFLOW\` runs]($GITHUB_SERVER_URL/$repo/actions/workflows/$CHECK_WORKFLOW?query=branch%3A$branch), and the [relock run]($GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID).

          To turn the setting on:
          1. An organization owner opens https://github.com/organizations/${repo%%/*}/settings/actions, scrolls to **Workflow permissions**, ticks **Allow GitHub Actions to create and approve pull requests** and clicks **Save**. That lets every repository of the organization turn it on.
          2. Open https://github.com/$repo/settings/actions (**Settings**, then **Actions** → **General**), tick the same box under **Workflow permissions**, and click **Save**.
          3. Run the relock again: https://github.com/$repo/actions/workflows/relock.yml → **Run workflow**. It opens the pull request and closes this issue.
          ISSUE
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$repo" --body-file ~/relock/issue.md
          else
            gh label create "human only" --repo "$repo" --color B60205 --description "Needs a person: a setting, a secret or a decision" 2>/dev/null || true
            gh issue create --repo "$repo" --title "$issue_title" --label "human only" --body-file ~/relock/issue.md
          fi
          echo "::warning::Could not open the relock pull request: GitHub Actions may not create pull requests here. $branch is pushed and $CHECK_WORKFLOW dispatched on it; a \"human only\" issue names the branch and says how to turn the setting on."
